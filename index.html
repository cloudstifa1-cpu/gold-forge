GF.sec({id:'alloys', title:'Alloy Systems', sub:'Mixing metals for better properties', topics:[
{t:'What an Alloy Is and Why They Exist', b:`
An **alloy** is a metal mixed with one or more other elements (metals or nonmetals like carbon) to improve its properties.

# Why make alloys
- **Stronger and harder** — pure metals are usually soft (pure iron, pure gold, pure aluminum)
- **Corrosion resistance** — chromium in stainless steel
- **Lower melting point** — solders, fusible alloys
- **Castability** — silicon in aluminum
- **Color** — brass, rose gold, white gold
- **Cost** — less expensive metal mixed in
- **Special properties** — magnetic, electrical, heat resistance, wear resistance

# How alloying strengthens
1. **Solid solution strengthening** — different-sized atoms distort the lattice and block dislocations
- **Substitutional** — atoms of similar size swap in (Zn in Cu, Ni in Cu, Cr in Fe). **Hume-Rothery rules**: under about 15% size difference, same crystal structure, similar electronegativity and valence → good solubility.
- **Interstitial** — tiny atoms fit between (C, N in Fe)
2. **Second phases** — hard particles or layers (cementite in steel, CuAl₂ in aluminum)
3. **Precipitation hardening** — fine particles grow out of a supersaturated solution
4. **Changing transformations** — alloying lets steel harden more deeply (hardenability)

# Phase diagram words
- **Solidus** — below this, all solid
- **Liquidus** — above this, all liquid
- **Mushy zone** — between them; part solid, part liquid
- **Eutectic** — a composition that melts at one sharp, lowest temperature (solder 63Sn-37Pb at 183 °C)
- **Solid solution** — one phase with atoms mixed in a single crystal structure
- **Intermetallic compound** — fixed-ratio compound of metals (Ni₃Al, CuAl₂)
- **Isomorphous** — the two metals dissolve in each other at all compositions (copper-nickel, gold-silver)

Gold-silver and gold-copper are fully soluble, which is why karat golds can be any color mix and why parting needs extra silver.
`},
{t:'Steel (Fe + C)', b:`
Steel is iron with up to about **2.1% carbon** (most steels are under 1%) plus small amounts of manganese and other elements.

# Plain carbon steel grades
- **Low carbon (mild steel)** — under about 0.25–0.30% C. Soft, ductile, weldable, cheap. Car bodies, structural shapes, wire, nails. Can't be hardened much by quenching.
- **Medium carbon** — about 0.30–0.60% C. Stronger; heat-treatable. Shafts, gears, axles, rails, crankshafts.
- **High carbon** — about 0.60–1.0%+ C. Very hard after quenching; less ductile. Springs, knives, cutting tools, music wire.

# AISI / SAE numbering (4 digits)
- **First two digits** — alloy family
- **Last two digits** — carbon content in **hundredths of a percent**

Examples:
- **1018** — plain carbon, 0.18% C (mild)
- **1045** — plain carbon, 0.45% C (medium)
- **1095** — plain carbon, 0.95% C (high, knives/springs)
- **11xx / 12xx** — resulfurized/free-machining
- **13xx** — manganese
- **41xx** — chromium-molybdenum ("chromoly" — 4130, 4140)
- **43xx** — nickel-chromium-molybdenum (4340, high strength)
- **51xx** — chromium (5160 springs)
- **52100** — high-carbon chromium bearing steel
- **86xx** — nickel-chromium-molybdenum

# Alloying elements in steel
- **Carbon** — the most powerful hardener
- **Manganese** — strength, hardenability; ties up sulfur as MnS
- **Silicon** — deoxidizer; strength; electrical steel
- **Chromium** — hardenability, wear, corrosion and oxidation resistance
- **Nickel** — toughness (especially in cold), hardenability; stabilizes austenite
- **Molybdenum** — hardenability, high-temperature strength; prevents temper embrittlement
- **Vanadium** — fine grains; hard carbides
- **Tungsten** — red-hardness in tool steels
- **Cobalt** — hot hardness in high-speed steel
- **Boron** — tiny amounts boost hardenability a lot
- **Sulfur, lead** — free machining (but lower toughness)
- **Phosphorus, sulfur** — usually harmful impurities (brittleness)

# Other steel families
- **HSLA (high-strength low-alloy)** — microalloyed with Nb, V, Ti; bridges, pipelines
- **Tool steels** — see below
- **Stainless steels** — see below
- **Maraging steels** — very high strength; aged nickel-cobalt-molybdenum
- **Weathering steel** (Cor-Ten) — forms a stable rust layer
`},
{t:'Cast Iron', b:`
Iron with **over about 2.1% carbon** (usually 2.5–4%) and 1–3% silicon. Melts lower than steel and **casts easily**, but is less ductile.

# Types (based on how the carbon appears)
- **Gray iron** — carbon as **graphite flakes**. Gray fracture. Machines well, damps vibration, good wear. Brittle in tension. Engine blocks, brake rotors, machine bases, pipes.
- **Ductile (nodular) iron** — **magnesium** (or cerium) added just before casting makes graphite form **spheres**. Much tougher and stronger; can bend. Pipes, crankshafts, suspension parts.
- **White iron** — carbon as **cementite (Fe₃C)**; fast cooling, low silicon. White fracture. Very hard and brittle, wear-resistant. Grinding mill liners, slurry pumps (high-chrome white iron).
- **Malleable iron** — white iron given a long anneal so cementite breaks down into **compact graphite clumps**. Tougher. Pipe fittings, small parts.
- **Compacted graphite iron (CGI)** — worm-like graphite; between gray and ductile. Diesel engine blocks.

# Carbon equivalent
> CE = %C + (%Si + %P) ÷ 3
CE of 4.3 is eutectic. Higher CE → more graphite, softer, easier to cast.

Hook: **"Gray Flakes, Ductile Balls, White Carbide, Malleable Clumps."**
`},
{t:'Stainless Steel (Fe + Cr + Ni)', b:`
Steel with **at least 10.5% chromium**. Chromium forms an invisible, self-healing **chromium oxide (Cr₂O₃) passive film** that stops rust. If scratched, it re-forms in air.

# Families
**Austenitic (300 series)** — FCC; Cr + Ni; non-magnetic; can't be hardened by heat treatment (only cold work); excellent toughness and corrosion resistance.
- **304** — "18-8" (18% Cr, 8% Ni); kitchen, food, general use
- **316** — adds **2–3% molybdenum**; resists chloride pitting; marine, chemical, medical
- **304L / 316L** — low carbon (under 0.03%) for welding (prevents sensitization)
- **321, 347** — Ti or Nb stabilized

**Ferritic (400 series)** — BCC; Cr only (about 11–27%); magnetic; can't be hardened; cheaper.
- **409** — exhaust systems; **430** — appliances, trim

**Martensitic (400 series)** — higher carbon; magnetic; **can be quenched and hardened**.
- **410** — general; **420** — cutlery, surgical; **440C** — bearings, high-end knives

**Duplex** — about half austenite, half ferrite; twice as strong as 304; resists stress corrosion cracking. **2205**.

**Precipitation-hardening (PH)** — aged for high strength. **17-4 PH** (aerospace, valves).

# Key problems
- **Sensitization** — heating 304 in about 450–850 °C (e.g. welding) makes chromium carbides at grain boundaries; nearby areas lose chromium and corrode (intergranular corrosion). Fix: low-carbon "L" grades or stabilized grades.
- **Chloride pitting and stress corrosion cracking** — 304 in salt water or pools; use 316, duplex.
- **Galling** — stainless on stainless threads can seize.

# Passivation
Treating stainless in nitric or citric acid to dissolve surface iron and thicken the chromium oxide film.

Hook: **"10.5% Chrome = Corrosion-proof Coat."**
`},
{t:'Tool Steels', b:`
High-carbon alloy steels for cutting, forming, and shaping other materials. Very hard and wear-resistant; hold an edge.

# AISI tool steel groups (letter = how it's hardened or used)
- **W** — **water-hardening** (plain high carbon). W1. Cheap, shallow hardening.
- **O** — **oil-hardening**. O1 (gauges, dies, knives).
- **A** — **air-hardening**. A2 (dies, punches). Little distortion.
- **D** — high carbon, **high chromium** (about 12% Cr). D2 (long-run dies, knives). Very wear-resistant.
- **S** — **shock-resisting**. S7 (chisels, punches, hammers).
- **H** — **hot-work** (forging dies, die-casting dies). H13.
- **M** — **molybdenum high-speed steel**. M2 (drill bits).
- **T** — **tungsten high-speed steel**. T1.
- **P** — mold steels (plastic molds). P20.

# High-speed steel
Keeps hardness when the tool gets red-hot from cutting ("red hardness") thanks to tungsten, molybdenum, vanadium, and cobalt carbides.

# Tungsten carbide (cemented carbide)
Not a steel: hard WC particles held together with **cobalt** binder by powder metallurgy (sintering). Harder and more heat-resistant than high-speed steel. Inserts, drill bits, mining tools.
`},
{t:'Brass (Cu + Zn)', b:`
Copper + **zinc** (typically 5–45% Zn). Gold-colored, easy to machine, casts well, good corrosion resistance, low friction.

# Common brasses
- **Gilding metal** — 95Cu-5Zn — reddish; ammunition jackets, jewelry
- **Red brass** — 85Cu-15Zn — plumbing
- **Cartridge brass (C260)** — 70Cu-30Zn — very ductile; **shell casings**, radiator parts. Most deep-drawable.
- **Yellow brass** — 65Cu-35Zn — hardware
- **Muntz metal** — 60Cu-40Zn — hot-workable; marine, bolts
- **Free-cutting brass (C360)** — about 61.5Cu-35.5Zn-3Pb — the easiest metal to machine (lead breaks chips); fittings, keys
- **Naval brass** — adds tin for seawater

# Phases
- **Alpha (α) brass** — under about 35% Zn; FCC; ductile, cold-workable
- **Alpha-beta brass** — about 35–45% Zn; stronger; hot-workable

# Problems
- **Dezincification** — zinc leaches out in water, leaving weak porous copper. Fix: add arsenic, use DZR brass, or tin.
- **Season cracking** — stress corrosion cracking from ammonia (named after cartridge cases cracking in monsoon season).

Hook: **"BraZZ has Zinc; BronTe has Tin."**
`},
{t:'Bronze (Cu + Sn)', b:`
Copper + **tin** (traditionally about 10–12% Sn). Harder and stronger than brass, excellent wear and seawater resistance, low friction. The first engineered alloy (Bronze Age, about 3300 BC).

# Common bronzes
- **Tin bronze** — 88Cu-12Sn — bells (bell metal up to about 20% Sn), statues, gears
- **Phosphor bronze** — Cu + 0.5–11% Sn + a little **phosphorus** (deoxidizer) — springs, electrical contacts, bearings, guitar strings
- **Aluminum bronze** — Cu + 5–12% **Al** — very strong, corrosion and wear resistant; ship propellers, pump parts, **non-sparking tools**
- **Silicon bronze** — Cu + Si — welding wire, marine hardware
- **Leaded bronze / bearing bronze** — lead adds lubricity for bushings
- **Manganese bronze** — really a high-strength brass; propellers

# Why tin strengthens copper
Tin atoms are larger than copper atoms → strong solid-solution strengthening; above about 8–10% tin, hard delta (δ) phase forms.

# Copper-nickel
**Cupronickel** (90Cu-10Ni, 70Cu-30Ni) — superb seawater corrosion resistance; heat exchangers, coins (US nickel is 75Cu-25Ni).

# Beryllium copper
Cu + about 2% Be — precipitation hardened; strongest copper alloy; springs, non-sparking tools. Beryllium dust is toxic.
`},
{t:'Aluminum Alloys (Al + Mg/Si/Cu/Zn)', b:`
Light (2.70 g/cm³, about one third of steel), corrosion-resistant, conductive. Pure aluminum is soft; alloys get strong.

# Wrought alloy series (4 digits)
- **1xxx** — 99%+ pure Al — foil, electrical conductors (1100, 1350)
- **2xxx** — **copper** — high strength, heat-treatable, poorer corrosion resistance; aircraft (2024)
- **3xxx** — **manganese** — moderate strength, non-heat-treatable; cans, cookware (3003)
- **4xxx** — **silicon** — welding and brazing wire (4043)
- **5xxx** — **magnesium** — non-heat-treatable, strong, excellent marine corrosion resistance; boats, tanks (5052, 5083)
- **6xxx** — **magnesium + silicon** — heat-treatable, extrudes easily; the most common structural alloy (6061, 6063 window frames)
- **7xxx** — **zinc** (+Mg, Cu) — highest strength, heat-treatable; aircraft, bike parts (7075)
- **8xxx** — other (lithium — 8090)

Hook for the series: **"Pure, Copper, Manganese, Silicon, Magnesium, Mag-Sil, Zinc, Other"** — **"People Can't Make Silly Mistakes, My Zesty Owl."**

# Temper designations
- **F** — as fabricated
- **O** — annealed (softest)
- **H** — strain hardened (H14, H32...) for non-heat-treatable alloys
- **T** — heat treated:
- **T4** — solution treated + **naturally aged** (room temperature)
- **T6** — solution treated + **artificially aged** (oven) — peak strength
- **T5** — cooled from hot working + artificially aged
- **T7** — over-aged (better stress corrosion resistance)

Example: **6061-T6** = Mg-Si alloy, solution treated and artificially aged.

# Cast alloys (xxx.x)
- **356 / A356** — Al-Si-Mg — wheels, castings
- **380** — Al-Si-Cu — die castings
Silicon makes aluminum flow into molds and reduces shrinkage.
`},
{t:'Magnesium Alloys (Mg + Al/Zn/Mn)', b:`
The **lightest structural metal** (1.74 g/cm³ — about two-thirds of aluminum). HCP → limited cold formability.

# Designation (ASTM)
Two letters for the main alloying elements, then their rounded percentages.
- **A** = aluminum, **Z** = zinc, **M** = manganese, **K** = zirconium, **E** = rare earths, **W** = yttrium

Examples:
- **AZ91D** — 9% Al, 1% Zn — the most common die-casting alloy
- **AZ31B** — 3% Al, 1% Zn — sheet and extrusions
- **AM60** — 6% Al, manganese — car seat frames, steering wheels (good ductility)
- **ZK60** — zinc + zirconium — forgings
- **WE43** — yttrium + rare earths — high temperature, aerospace

# Properties and uses
- Very light, good stiffness per weight, damps vibration
- Uses: laptop and camera bodies, power tool housings, car parts, aerospace castings
- **Poor corrosion resistance** (very active — bottom of the galvanic series); needs coatings; galvanic corrosion when touching steel
- Heat treatable (T4, T6) in some alloys

! Fine magnesium chips and powder **burn intensely**. Never use water — use a **Class D** extinguisher or dry sand.
`},
{t:'Titanium Alloys (Ti + Al/V)', b:`
Strong as many steels at about 56% of the weight (4.51 g/cm³). Outstanding corrosion resistance (TiO₂ film). Biocompatible. Expensive.

# Alloy types by phase
- **Alpha (α) alloys** — HCP; Al, O, N, Sn stabilize alpha. Weldable, good at high temperature and in cold. Commercially pure (CP) grades 1–4.
- **Alpha-beta alloys** — mix; heat-treatable. **Ti-6Al-4V (Grade 5)** = 6% aluminum, 4% vanadium — **the most used titanium alloy** (about half of all titanium).
- **Beta (β) alloys** — BCC; V, Mo, Cr, Fe stabilize beta. Very high strength after aging; formable.

# Uses
- Aircraft frames, jet engine fan blades and discs
- Medical implants (hips, dental implants) — bonds with bone
- Chemical plants, seawater piping, desalination
- Sports equipment, high-end bikes

# Processing cautions
- Must be welded with full **argon shielding** front and back — oxygen and nitrogen pick-up make it brittle (straw color OK, blue/gray = contaminated)
- Hard to machine (low heat conduction; galls)
- Fire risk with fine chips

# Nickel superalloys (related high-performance group)
**Inconel, Hastelloy, Waspaloy** — nickel with Cr, Co, Mo, Al, Ti. Keep strength above 1000 °C via **gamma prime (Ni₃(Al,Ti))** precipitates. Jet engine turbine blades, gas turbines, furnace parts.
`},
{t:'Precious Metal Alloys: Karat Gold, Sterling', b:`
# Karat gold
Pure gold (24K) is too soft for most jewelry. Alloying with silver, copper, zinc, nickel, or palladium makes it harder and changes color.

- **24K** — 99.9% Au — soft
- **22K** — 91.7% Au
- **18K** — 75.0% Au — fine jewelry
- **14K** — 58.3% Au — most common in the US
- **10K** — 41.7% Au — lowest legal "gold" in the US

# Colors
- **Yellow gold** — gold + roughly equal silver and copper
- **Rose / red gold** — more **copper**
- **White gold** — gold + **palladium** or **nickel** (often rhodium-plated for brightness)
- **Green gold** — gold + silver (natural electrum is greenish)

# Silver alloys
- **Fine silver** — 99.9% Ag
- **Sterling silver** — **92.5% Ag + 7.5% Cu** (925). Copper hardens it.
- **Coin silver** — about 90% Ag
- **Britannia silver** — 95.8%

# Platinum
Jewelry often **950 Pt** with ruthenium, cobalt, or iridium.

# Hallmarks and testing
- Stamp shows fineness (750 = 18K, 585 = 14K, 925 = sterling)
- Tests: **acid test stone** (touchstone with nitric/aqua regia test acids), XRF gun, specific gravity, and the definitive **fire assay**
`},
{t:'Solders, Bearing & Low-Melt Alloys', b:`
# Solders (melt below 450 °C)
- **63Sn-37Pb** — eutectic; melts sharply at **183 °C** — old electronics standard
- **60Sn-40Pb** — melts over a small range
- **SAC305** — 96.5Sn-3Ag-0.5Cu — lead-free electronics, about 217–220 °C
- **Sn-Cu, Sn-Ag** — lead-free plumbing (lead solder is banned in drinking water lines)

# Brazing alloys (melt above 450 °C)
- **Silver brazing alloys** (Ag-Cu-Zn) — strong, about 600–800 °C
- **Brass / bronze** filler — "braze welding"
- **BCuP (copper-phosphorus)** — self-fluxing on copper

# Bearing alloys
- **Babbitt** — tin or lead base with antimony and copper — soft matrix with hard particles; engine bearings
- **Bearing bronzes**

# Fusible (low-melt) alloys
- **Wood's metal, Field's metal, Rose's metal** — bismuth-based; melt around 47–100 °C. Fire sprinkler plugs, bending tubes, lens mounting.
- **Galinstan** — gallium-indium-tin — liquid at room temperature (mercury substitute)

# Type metal
Lead-antimony-tin; expands slightly on freezing for sharp castings (historic printing).

# Pewter
Mostly tin with antimony and copper (modern pewter is lead-free).
`}
]});

GF.sec({id:'heat', title:'Heat Treatment', sub:'Changing properties with heat and cooling', topics:[
{t:'Heat Treatment Basics', b:`
**Heat treatment** = heating and cooling a solid metal in a controlled way to change its microstructure and properties. The **chemistry stays the same**; the **structure changes**.

# Three variables control everything
1. **Temperature** — how hot
2. **Time** — how long it soaks
3. **Cooling rate** — how fast it cools (furnace, air, oil, water, brine)

# The main processes
- **Annealing** — softens, relieves stress, improves ductility
- **Normalizing** — refines grains; uniform, slightly stronger than annealed
- **Hardening (quenching)** — makes steel hard (martensite)
- **Tempering** — reduces brittleness after hardening
- **Stress relieving** — removes internal stress without changing much else
- **Case hardening** — hard surface, tough core
- **Solution treating & aging** — strengthens aluminum, magnesium, nickel, titanium, PH stainless alloys

# Shop equipment
- Furnaces: electric, gas, vacuum, salt bath, fluidized bed
- **Thermocouples** and **pyrometers** measure temperature
- **Quench tanks** with agitation
- **Controlled atmosphere** to prevent scaling and **decarburization** (loss of surface carbon)

# Protecting the surface
- Stainless foil wraps, inert gas, vacuum, anti-scale coatings, or packing in charcoal/cast iron chips
`},
{t:'Annealing', b:`
**Purpose**: make metal **soft, ductile, machinable**; remove work hardening; relieve stress; refine structure.

# Full anneal (steel)
1. Heat to about **30–50 °C above A3** (hypoeutectoid steel) or above A1 (hypereutectoid). For 1045 that's roughly 840–870 °C.
2. **Soak** — about 1 hour per inch (25 mm) of thickness
3. **Cool very slowly in the furnace** (turn it off and leave the door shut)
- Result: **coarse pearlite + ferrite** — softest condition

# Process anneal (subcritical / recrystallization anneal)
For cold-worked low-carbon steel, copper, brass, aluminum between forming steps.
1. Heat **below A1** (steel about 550–650 °C)
2. Hold until **recrystallization** — new, strain-free grains replace the deformed ones
3. Cool (rate less critical)

# Spheroidize anneal
For high-carbon and tool steels before machining.
- Hold just below (or cycle around) A1 for many hours → cementite forms **round balls (spheroidite)** — softest, most machinable form of high-carbon steel.

# Stress relief
- Heat steel to about **550–650 °C**, hold, cool slowly
- Removes stresses from welding, machining, cold work without big property changes

# Annealing non-ferrous metals
- **Copper** — about 400–650 °C; can be quenched or air cooled (no hardening phase)
- **Brass** — about 425–700 °C
- **Aluminum** (O temper) — about 345–415 °C, slow cool
- **Gold and silver** (jewelry, assay) — heat to dull red, quench in water or pickle; softens work-hardened metal

# The three stages of annealing a cold-worked metal
1. **Recovery** — stress relief; dislocations rearrange
2. **Recrystallization** — new grains form; metal softens
3. **Grain growth** — grains grow if held too long or too hot (bad — weaker)

**Recrystallization temperature** ≈ **0.3–0.5 × melting point (in kelvin)**.
`},
{t:'Normalizing', b:`
**Purpose**: refine coarse grains (from forging, casting, welding), make the structure uniform, slightly stronger and tougher than annealed.

# Steps (steel)
1. Heat about **50–80 °C above A3** (or above Acm for high-carbon steel)
2. Soak to fully austenitize
3. **Cool in still air**

# Result
**Fine pearlite + ferrite**. Finer than annealing because air cooling is faster.

# Annealing vs normalizing
- **Annealing** — furnace cool → softest, most ductile
- **Normalizing** — air cool → finer grains, a bit harder and stronger, more uniform

Normalizing is often done on forgings and castings before hardening so the hardening response is even.

Hook: **"Normal people cool off in the Air."**
`},
{t:'Hardening & Quenching', b:`
**Purpose**: make steel **hard** by forming **martensite**.

# Steps
1. **Austenitize** — heat to about **30–50 °C above A3** (hypoeutectoid) or just above **A1** (hypereutectoid/tool steels). For 1095 about 790–815 °C; 1045 about 820–845 °C; always follow the steel's data sheet.
2. **Soak** — so carbon dissolves evenly in the austenite
3. **Quench** — cool fast enough to miss the pearlite nose
4. Immediately **temper** (untempered martensite is brittle and can crack just sitting)

# Why it hardens (the chemistry)
In austenite (FCC), carbon atoms sit comfortably between iron atoms. When cooled fast, the iron tries to switch to BCC, but carbon has **no time to diffuse out**. It gets trapped and distorts the lattice into **body-centered tetragonal (BCT) martensite**. That strained lattice blocks dislocations → very hard.

More carbon = harder martensite (up to about 0.6–0.8% C, max around HRC 65–67).

# Quench media (fastest to slowest)
1. **Brine** (salt water) — fastest; breaks up the vapor blanket
2. **Water**
3. **Polymer quenchants** (adjustable)
4. **Oil** — slower; less distortion and cracking
5. **Molten salt** (martempering/austempering)
6. **Air / gas** — for air-hardening steels

# The three quench stages
1. **Vapor blanket** — steam insulates the part (slow)
2. **Boiling** — fastest cooling
3. **Convection** — slow
Agitating the part (up and down, not swirling) breaks the vapor blanket.

# Quench problems
- **Cracking** — too harsh a quench; sharp corners; thin next to thick sections
- **Distortion / warping** — uneven cooling; enter the quench vertically
- **Soft spots** — vapor pockets, scale, decarburization
- **Retained austenite** — high-carbon steels; fix with sub-zero treatment

# Quick checks
- **File test** — file should skate on a fully hardened part
- **Magnet** — hardening temperature is just past where many plain carbon steels lose magnetism (Curie point, 770 °C) — a rough blacksmith check, not exact
- **Rockwell test** — the real check
`},
{t:'Tempering', b:`
**Purpose**: reduce the brittleness of as-quenched martensite and relieve quench stresses. Trades a little hardness for a lot of **toughness**.

# Steps
1. Clean the hardened part (so you can see colors)
2. Reheat to **below A1** — usually about **150–650 °C** depending on the use
3. Hold — typically at least **1 hour per inch** (many shops do 2 hours minimum)
4. Cool in air
5. Many tool steels get **double or triple tempers**

# What happens inside
Carbon finally gets to move a little. Tiny carbides precipitate out of the martensite; the lattice relaxes; internal stress drops. **Tempered martensite** is strong and tough.

# Temperature vs. result (plain carbon steel, rough guide)
- **150–200 °C** — max hardness kept, little toughness gain — razors, files, scrapers
- **200–300 °C** — knives, punches, chisels
- **300–400 °C** — axes, springs (some)
- **400–550 °C** — springs, shafts, tough parts
- **550–650 °C** — structural parts needing high toughness

# Temper colors (oxide film on clean bright steel — approximate)
- **Pale straw** — about 200–220 °C — razors, scrapers
- **Dark straw / gold** — about 230–240 °C — knives, drill bits
- **Brown / bronze** — about 250–260 °C — taps, dies, punches
- **Purple** — about 270–280 °C — chisels, axes
- **Dark blue** — about 290–300 °C — springs, saws
- **Light blue / gray** — about 310–330 °C and up

The color depends on time too — use a thermometer or oven for accurate work.

# Temper embrittlement
Some alloy steels lose toughness if held or slow-cooled through about **375–575 °C**. Molybdenum helps prevent it. **"Blue brittleness"** around 230–370 °C is a related effect.

Hook: **"Quench makes it Hard, Temper makes it Tough."**
`},
{t:'Austempering & Martempering', b:`
Special quenches using hot salt baths to cut cracking and distortion.

# Martempering (marquenching)
1. Austenitize
2. Quench into salt or oil **just above Ms**
3. Hold until the whole part is the same temperature (but not long enough to form bainite)
4. Cool in air through the martensite range
5. **Temper** as usual
Result: martensite with much less distortion and cracking risk.

# Austempering
1. Austenitize
2. Quench into salt at about **260–400 °C** (above Ms)
3. **Hold** until austenite fully transforms to **bainite**
4. Cool in air (no temper needed)
Result: **bainite** — tough, springy, less distortion. Springs, lawnmower blades, **austempered ductile iron (ADI)**.
`},
{t:'Case Hardening (Surface Hardening)', b:`
Makes a **hard, wear-resistant surface** while keeping a **tough core**. Gears, camshafts, bearings, pins.

# Carburizing — adds carbon to the surface
1. Use low-carbon steel (about 0.1–0.25% C) for a tough core
2. Heat to about **900–950 °C** in a carbon-rich environment:
- **Gas carburizing** (endothermic gas + natural gas) — most common
- **Pack carburizing** (charcoal + barium carbonate in a sealed box)
- **Liquid (salt bath)** (cyanide salts — hazardous)
- **Vacuum (low-pressure) carburizing**
3. Carbon diffuses in (depth depends on time — square-root law)
4. **Quench** → high-carbon martensite on the surface, softer core
5. **Temper** low (about 150–200 °C)
Typical case depth: about 0.5–2 mm.

# Nitriding — adds nitrogen
- Heat to about **500–550 °C** (below A1, so **no quench** and very little distortion) in ammonia gas, plasma (ion), or salt
- Forms very hard **nitrides** with Al, Cr, Mo, V
- Thin, very hard case; long cycle (hours to days)
- Used on finished parts, dies, crankshafts

# Carbonitriding / nitrocarburizing
Carbon + nitrogen together. Ferritic nitrocarburizing (salt bath, gas) for wear and corrosion resistance.

# Selective hardening (no chemistry change)
Medium- or high-carbon steel, heat only the surface, then quench:
- **Flame hardening** — oxy-fuel torch
- **Induction hardening** — electric coil heats the surface in seconds; quench spray follows
- **Laser / electron beam hardening**

# Boriding
Boron diffused in → extremely hard iron borides.
`},
{t:'Solution Treating & Aging (Precipitation Hardening)', b:`
Used for **aluminum (2xxx, 6xxx, 7xxx), magnesium, nickel superalloys, titanium, PH stainless, beryllium copper, maraging steel**.

# The idea
At high temperature, the alloying elements dissolve into one solid solution. Quench to **trap them** (supersaturated). Then let them come out as **extremely fine precipitates** that block dislocations.

# Steps (aluminum example: 6061)
1. **Solution treat** — heat to about **530 °C** (just below the solidus) and hold, so Mg and Si dissolve fully
2. **Quench** fast in water — traps the elements in a **supersaturated solid solution (SSSS)**. Now soft and formable for a while (W temper).
3. **Age**:
- **Natural aging** — at room temperature for days → **T4**
- **Artificial aging** — in an oven at about **160–175 °C** for about 8–18 hours → **T6** (peak strength)

# What's happening
Precipitates form in a sequence: solute clusters (**GP zones**) → fine coherent precipitates (strongest — lattice strained around them) → coarse incoherent precipitates (weaker).
- **Under-aged** → not yet full strength
- **Peak-aged** → maximum strength
- **Over-aged** → particles too big; strength drops (but better stress corrosion resistance — T7)

# Aluminum-copper example (2024 / classic)
Precipitate sequence: GP zones → θ″ → θ′ → θ (CuAl₂).

# Magnesium alloys
- AZ91: solution treat about 410–420 °C, age about 170–215 °C (T6)
- Magnesium oxidizes and can ignite in furnaces — protective atmosphere (SO₂ or CO₂/SF₆ alternatives) used

# Practical notes
- Rivets of 2017/2024 were historically kept in a **freezer** after quenching to delay natural aging until driven ("icebox rivets")
- Welding destroys the temper in the heat-affected zone of heat-treatable aluminum
- Temperature control must be tight (± a few degrees) — too hot and the alloy partly melts at grain boundaries ("burning")

Hook: **"Dissolve, Freeze, Grow tiny rocks."**
`},
{t:'Cryogenic & Other Treatments', b:`
# Sub-zero / cryogenic treatment
Cooling hardened steel to about **−80 °C (dry ice)** or **−196 °C (liquid nitrogen)** right after quenching turns **retained austenite** into martensite. Improves wear resistance and dimensional stability (gauges, bearings, tool steels). Always temper after.

# Homogenizing
Long hold at high temperature to even out chemical segregation in castings and ingots before rolling.

# Hydrogen bake-out (de-embrittlement)
After electroplating or acid pickling high-strength steel, bake at about **190–220 °C** for several hours to drive out absorbed hydrogen.

# Shot peening
Not heat — blasting the surface with small steel shot puts it in **compression**, greatly improving fatigue life (springs, gears, aircraft parts).

# Precipitation of carbides in stainless
Avoid long times in 450–850 °C (sensitization). **Solution anneal** at about 1040–1100 °C and quench to redissolve chromium carbides.
`}
]});

GF.sec({id:'forming', title:'Forming & Shaping', sub:'Casting, forging, rolling, machining, welding', topics:[
{t:'Hot Work vs Cold Work', b:`
# Hot working
Deforming metal **above its recrystallization temperature**. New grains form continuously, so it doesn't work harden.
- Huge shape changes with less force
- Refines cast structure, closes porosity
- Scale on surface, looser tolerances
- Examples: hot rolling, forging, extrusion of steel

# Cold working
Deforming **below the recrystallization temperature** (usually room temperature).
- Metal **work hardens** — stronger and harder, less ductile
- Better surface finish and tighter tolerances
- Needs more force; may need **annealing between passes**
- Examples: cold rolling, wire drawing, stamping, cold heading

# Percent cold work
> %CW = (A₀ − A_final) ÷ A₀ × 100

# Warm working
In between — used for some steels, titanium, magnesium.

Note: lead and tin recrystallize **below room temperature**, so working them at room temperature is technically hot working — they don't work harden.
`},
{t:'Casting', b:`
Pouring molten metal into a mold cavity and letting it solidify. Best for complex shapes, large parts, and metals that are hard to form.

# Sand casting
1. Make a **pattern** (wood, plastic, metal) of the part (slightly oversized for shrinkage)
2. Pack **green sand** (silica sand + clay + water) around it in a flask (cope = top half, drag = bottom half)
3. Add **cores** for internal holes
4. Remove the pattern; cut the **gating system** (pouring cup, sprue, runners, gates) and **risers** (feeders)
5. Close the mold; **pour**
6. Cool; **shake out**; cut off gates and risers; clean (fettle)
- Any metal; low cost; rough surface; cast iron, steel, bronze, aluminum

# Investment (lost-wax) casting
1. Make a **wax pattern** (injected)
2. Attach to a wax tree (sprue)
3. Dip in ceramic slurry and stucco repeatedly → shell
4. Melt out the wax (autoclave or flash fire)
5. Fire the shell; pour metal into the hot shell
6. Break off shell; cut parts from the tree
- Precise, smooth, complex; **jewelry (gold, silver), turbine blades, implants, firearms parts**
- Jewelers use **centrifugal** or **vacuum** investment casting with gypsum-bonded investment

# Die casting
Molten metal **injected under high pressure** into steel dies.
- Fast, precise, thin walls
- **Aluminum, zinc, magnesium** (low-melting metals)
- Hot chamber (zinc, magnesium) vs cold chamber (aluminum)

# Permanent mold (gravity die) casting
Reusable metal molds, gravity pour — aluminum wheels, pistons.

# Centrifugal casting
Spinning mold flings metal outward — pipes, cylinder liners, rings.

# Continuous casting
Steel, copper, aluminum poured continuously into a water-cooled mold to make slabs, billets, rod.

# Shrinkage allowances (approximate)
Cast iron about 1%, steel about 2%, aluminum about 1.3%, brass about 1.5%.

# Solidification
- Metal freezes from the mold wall inward: **chill zone → columnar grains → equiaxed grains** in the center
- **Directional solidification** toward risers prevents shrinkage holes
- **Inoculants** and **grain refiners** (e.g. Ti-B in aluminum) give finer grains
`},
{t:'Forging', b:`
Shaping metal by **compressive force** — hammering or pressing — usually hot.

# Types
- **Open-die forging** — flat or simple dies; metal not fully enclosed. Blacksmithing, large shafts.
- **Closed-die (impression-die) forging** — metal fills a shaped cavity; flash squeezes out and is trimmed. Wrenches, crankshafts, connecting rods.
- **Upset forging** — increases diameter at one end (bolt heads)
- **Roll forging, ring rolling, swaging**

# Steps (closed die)
1. Cut billet to size
2. Heat (steel about 1100–1250 °C; aluminum about 400–500 °C; titanium about 900–1000 °C)
3. Descale
4. **Blocker** forging → **finisher** forging
5. **Trim** flash
6. Heat treat, machine, inspect

# Why forgings are strong
Forging closes porosity, refines grains, and makes the **grain flow follow the part's shape** — like wood grain following a curve. Much better fatigue and impact resistance than a casting or a part machined from bar.

# Good forging metals
Carbon and alloy steel, stainless, aluminum, titanium, copper alloys, nickel alloys.
`},
{t:'Rolling, Extrusion & Drawing', b:`
# Rolling
Squeezing metal between rotating rolls to reduce thickness.
- **Hot rolling** — slabs to plate, sheet, structural shapes (I-beams), rail
- **Cold rolling** — thinner, smoother, stronger sheet; tighter tolerance
- **Shape rolling** — rails, beams, rebar
- **Thread rolling** — forms threads (stronger than cut threads)

# Extrusion
Pushing a heated billet through a **shaped die** — like toothpaste.
- **Direct (forward)** and **indirect (backward)** extrusion
- Long parts with a constant cross-section: window frames, rails, tubes, heat sinks
- **Aluminum** (6061, 6063) is the classic extrusion metal (about 400–500 °C); also copper, brass, magnesium, steel (with glass lubricant)

# Drawing
Pulling metal through a die to reduce its diameter.
- **Wire drawing** — copper, steel, gold, silver wire. Annealed between passes.
- **Tube drawing**
- Jewelers use **drawplates**.

# Deep drawing
Punching sheet into a die cavity to make cups — cans, cartridge cases, sinks. Needs ductile metal (cartridge brass, aluminum, low-carbon steel, 304 stainless).
`},
{t:'Stamping & Sheet Metal', b:`
Cutting and forming sheet metal in presses with dies.

# Operations
- **Blanking** — punch out the part (keep the piece)
- **Punching / piercing** — make holes (keep the sheet)
- **Bending** — V-dies, press brakes
- **Forming / drawing** — shapes from flat sheet
- **Coining** — very high pressure for fine detail (coins, medals)
- **Embossing** — raised designs
- **Progressive dies** — many operations, one station after another, one part per stroke

# Things to watch
- **Springback** — metal partly springs back after bending; overbend to compensate
- **Minimum bend radius** — too tight cracks the outside
- **Grain direction** — bend across the rolling direction when possible
- **Burrs** on cut edges

# Good stamping metals
Low-carbon steel, aluminum (1xxx, 3xxx, 5xxx), brass, copper, 300-series stainless.
`},
{t:'Machining', b:`
Removing metal with cutting tools to get exact shapes, sizes, and finishes.

# Processes
- **Turning** — lathe; part spins, tool moves
- **Milling** — tool spins, part moves
- **Drilling, boring, reaming, tapping**
- **Grinding** — abrasive wheel; very fine finishes and hard materials
- **Sawing, broaching, honing, lapping**
- **CNC** — computer-controlled machines

# Non-traditional machining
- **EDM (electrical discharge machining)** — sparks erode hardened steel
- **Waterjet** (with abrasive garnet)
- **Laser and plasma cutting**
- **Electrochemical machining (ECM)**

# Cutting tool materials (softer to harder)
- High-speed steel → cobalt HSS → **carbide** → coated carbide (TiN, TiAlN) → ceramics → CBN (cubic boron nitride) → diamond (non-ferrous only)
Rule: **the tool must be harder than the workpiece**.

# Machinability
- **Best**: free-cutting brass (C360), 12L14 steel, aluminum 6061, cast iron (graphite breaks chips)
- **Hard**: titanium, nickel superalloys, austenitic stainless (work hardens), hardened steel

# Cutting fluids
Cool the tool, lubricate, flush chips, prevent rust. Soluble oil (coolant), straight oils, synthetics.
`},
{t:'Welding & Joining', b:`
**Welding** melts and fuses the base metals (usually with filler metal). **Brazing and soldering** melt only the filler.

# Fusion welding processes
- **SMAW (Shielded Metal Arc, "stick")** — flux-coated electrode; flux makes slag and shielding gas. Rugged, outdoors, steel.
- **GMAW (Gas Metal Arc, "MIG")** — wire fed through a gun, shielding gas (argon/CO₂). Fast, production work.
- **FCAW (Flux-Cored Arc)** — tubular wire with flux inside; outdoors, thick steel.
- **GTAW (Gas Tungsten Arc, "TIG")** — non-consumable **tungsten** electrode, argon shield, separate filler rod. Precise, clean; **aluminum, stainless, titanium**, thin parts.
- **SAW (Submerged Arc)** — arc buried under granular flux; thick plate.
- **Oxy-acetylene (oxy-fuel)** — flame about 3,100 °C; welding, brazing, cutting, heating.
- **Resistance (spot) welding** — current through clamped sheets; car bodies.
- **Laser, electron beam, friction stir welding** (friction stir for aluminum — no melting).

# The heat-affected zone (HAZ)
Base metal next to the weld that didn't melt but got hot enough to change structure. Can be harder (steel martensite → cracking) or softer (heat-treated aluminum loses temper).

# Weld problems and causes
- **Porosity** — contamination, moisture, poor gas coverage
- **Cracking** — hydrogen (use low-hydrogen rods, preheat), high carbon, restraint
- **Lack of fusion / penetration** — too cold, too fast
- **Undercut** — too hot, wrong angle
- **Slag inclusions** — poor cleaning between passes
- **Distortion** — uneven heating

# Preheat and post-weld heat treatment
High-carbon and alloy steels (and cast iron) need **preheat** to slow cooling and avoid hard, cracking martensite. Thick or critical welds get **stress relief** afterward.
> Carbon equivalent (IIW): CE = C + Mn/6 + (Cr + Mo + V)/5 + (Ni + Cu)/15
Higher CE = harder to weld; above about 0.45 usually needs preheat.

# Brazing (filler melts above 450 °C, below base metal)
Silver brazing, brass, copper-phosphorus fillers. Joint drawn in by **capillary action**. Flux needed (borax, fluorides).

# Soldering (filler melts below 450 °C)
Electronics, plumbing, jewelry (jewelers' "hard," "medium," "easy" silver solders are actually brazing alloys).

# Other joining
Riveting, bolting, adhesive bonding, crimping.
`},
{t:'Powder Metallurgy & Additive Manufacturing', b:`
# Powder metallurgy (P/M)
1. **Make powder** — atomization (spraying molten metal with water or gas), chemical reduction (tungsten, iron), electrolysis (copper)
2. **Blend** with lubricant and alloy powders
3. **Compact** in a die under high pressure → "green" part
4. **Sinter** below the melting point in a protective atmosphere — particles bond by **diffusion**
5. Optional: size, infiltrate (copper), heat treat, oil-impregnate (self-lubricating bearings)

Uses: gears, bushings, tungsten carbide tools, tungsten filaments, high-melting metals (W, Mo, Ta), magnets.

# Metal injection molding (MIM)
Fine powder + binder injected like plastic, then debinded and sintered. Small complex parts.

# Additive manufacturing (3D printing metal)
- **Laser powder bed fusion** — laser melts powder layer by layer (titanium, Inconel, stainless, aluminum)
- **Directed energy deposition** — powder or wire melted by laser/arc as it's fed
- **Binder jetting** — glue powder then sinter
Parts often need HIP (hot isostatic pressing) and heat treatment.
`}
]});

GF.sec({id:'corrosion', title:'Corrosion & Protection', sub:'Why metals rot and how to stop it', topics:[
{t:'Corrosion Chemistry', b:`
**Corrosion** = metal reacting with its environment and returning toward its ore-like state (oxide, hydroxide, sulfide). It's extraction run backward — the metal gives back the energy that went into refining it.

# What you need for wet corrosion (all four)
1. **Anode** — where metal oxidizes and dissolves
2. **Cathode** — where a reduction happens
3. **Electrolyte** — water with dissolved salts or acids
4. **Electrical path** — the metal itself

Remove any one and corrosion stops. Every protection method attacks one of these.

# Rusting of iron, step by step
> Anode: Fe → Fe²⁺ + 2e⁻
> Cathode (neutral water): O₂ + 2H₂O + 4e⁻ → 4OH⁻
> Cathode (acid): 2H⁺ + 2e⁻ → H₂
> Fe²⁺ + 2OH⁻ → Fe(OH)₂
> 4Fe(OH)₂ + O₂ + 2H₂O → 4Fe(OH)₃ → Fe₂O₃·nH₂O (rust)

# Why salt makes it worse
Salt makes water a better electrolyte and chloride ions break down protective films → pitting.

# Passivity
Some metals form a thin, tight, self-healing oxide film that stops corrosion:
- **Stainless steel** — Cr₂O₃
- **Aluminum** — Al₂O₃
- **Titanium** — TiO₂
- **Nickel, chromium** — their oxides
Rust (iron oxide) is porous and flakes off, so it doesn't protect.

# Dry (high-temperature) oxidation
Metal + oxygen at high temperature forms **scale** with no water needed (furnace parts, hot rolling). Resisted by chromium, aluminum, silicon in the alloy.

# Corrosion rate
Measured in **mils per year (mpy)** or **mm per year** by weight-loss coupons or electrical probes.
`},
{t:'Galvanic Series & Galvanic Corrosion', b:`
**Galvanic corrosion** happens when two **different metals touch** in an electrolyte. The more active metal becomes the **anode and corrodes faster**; the more noble one is protected.

# Galvanic series in seawater (approximate order)
**Most active (anodic — corrodes)**
1. Magnesium
2. Zinc
3. Aluminum alloys
4. Cadmium
5. Mild steel, cast iron
6. Lead, tin
7. Brass, copper, bronze
8. Copper-nickel
9. Nickel
10. Stainless steel (passive)
11. Silver
12. Titanium
13. Graphite
14. Gold, platinum
**Most noble (cathodic — protected)**

Hook: **"Magnesium Moves, Gold Stays"** — the top of the list corrodes, the bottom is protected.

# The farther apart, the worse
A big potential difference = faster attack.

# Area effect
- **Small anode, big cathode = disaster** (steel rivets in a copper sheet — the rivets disappear fast)
- **Big anode, small cathode = OK** (copper rivets in steel sheet)

# Prevention
- Pick metals close together in the series
- **Insulate** them (plastic washers, sleeves, dielectric unions on water heaters)
- Paint the **cathode** too (or both) — never only the anode
- Add a **sacrificial anode**

# Using it on purpose
**Galvanizing and sacrificial anodes** use zinc, aluminum, or magnesium to corrode instead of steel.
`},
{t:'Types of Corrosion', b:`
# 1. Uniform (general) corrosion
Even attack over the whole surface. Predictable; designers add a **corrosion allowance** (extra thickness). Rust on bare steel.

# 2. Galvanic corrosion
Two different metals in contact in an electrolyte. See Galvanic Series.

# 3. Pitting corrosion
Small, deep holes in a passive metal where the film breaks down — usually from **chlorides**. Dangerous: little metal lost but can **perforate** pipes and tanks. Stainless and aluminum in salt water. Resist with **molybdenum** (316, duplex). **PREN** (pitting resistance equivalent number) = %Cr + 3.3 × %Mo + 16 × %N.

# 4. Crevice corrosion
Attack inside tight gaps (under gaskets, washers, deposits, lap joints). Oxygen gets used up in the crevice; it turns acidic and chloride-rich. Seal or weld crevices; design them out.

# 5. Intergranular corrosion
Attack along grain boundaries. **Sensitized stainless steel** (chromium carbides at boundaries). Fix with low-carbon or stabilized grades, or solution anneal.

# 6. Stress corrosion cracking (SCC)
Cracks from **tensile stress + a specific environment** + a susceptible metal, at stresses below yield. Sudden failure. Examples:
- Austenitic stainless + hot **chlorides**
- Brass + **ammonia** (season cracking)
- Carbon steel + caustic (caustic embrittlement) or nitrates
- High-strength aluminum (7xxx) + moisture
Prevent: relieve stresses, change alloy, change environment, shot peen.

# 7. Selective leaching (dealloying)
One element removed: **dezincification** of brass, **graphitization** of gray cast iron (iron leaches out, graphite skeleton left).

# 8. Erosion-corrosion & cavitation
Fast-flowing or turbulent fluid wears away the protective film; collapsing bubbles pit pump impellers and propellers.

# 9. Hydrogen damage
Hydrogen embrittlement, blistering, high-temperature hydrogen attack.

# 10. Microbiologically influenced corrosion (MIC)
Bacteria (sulfate-reducing bacteria) create corrosive conditions under deposits — pipelines, tanks.

# 11. Fretting
Tiny vibrating movement between contacting surfaces wears away oxide repeatedly.

# 12. Corrosion fatigue
Cyclic stress + corrosion → cracks much sooner than fatigue alone; no endurance limit.

Hook for the big five: **"U Got Pits, Cracks, and Stress"** — Uniform, Galvanic, Pitting, Crevice, Stress corrosion cracking.
`},
{t:'Coatings (Paints & Polymers)', b:`
Coatings put a **barrier** between metal and electrolyte. Some also contain inhibitors or sacrificial metal.

# Surface preparation (most coating failures start here)
1. **Degrease** — solvent or alkaline cleaner
2. **Remove rust and mill scale** — abrasive blasting (to a specified standard like "near-white"), power tools, or acid pickling
3. Create a **surface profile** (anchor pattern) for grip
4. Coat **immediately** before flash rust forms

# Paint system layers
1. **Primer** — grips the metal; often has rust inhibitors or **zinc-rich** pigment (sacrificial)
2. **Intermediate (build) coat** — thickness and barrier (epoxy)
3. **Topcoat** — weather and UV resistance, color (polyurethane)

# Coating types
- **Epoxies** — tough, chemical resistant; chalk in sunlight
- **Polyurethanes** — UV-resistant topcoats
- **Zinc-rich primers** — "cold galvanizing"
- **Powder coating** — dry powder sprayed electrostatically and baked; durable
- **Fusion-bonded epoxy (FBE)** — pipelines
- **Rubber and plastic linings** — tanks for acid
- **Conversion coatings** — phosphating (iron/zinc phosphate), chromating — improve paint adhesion
- **Oils, waxes, VCI** (volatile corrosion inhibitor) — temporary protection

# Measuring
**Dry film thickness (DFT)** gauges; holiday (pinhole) detectors on pipe coatings.
`},
{t:'Galvanizing', b:`
Coating steel with **zinc**. Zinc protects two ways:
1. **Barrier** — keeps water off the steel
2. **Sacrificial (cathodic) protection** — zinc is more active, so at a scratch the **zinc corrodes instead of the steel**

# Hot-dip galvanizing steps
1. **Degrease** — hot caustic solution
2. **Rinse**
3. **Pickle** — dilute **hydrochloric** or sulfuric acid removes rust and mill scale
4. **Rinse**
5. **Flux** — dip in **zinc ammonium chloride** solution (or a molten flux blanket) to clean and protect
6. **Dry**
7. **Dip in molten zinc at about 450 °C** (zinc melts at 419.5 °C)
8. Zinc reacts with iron to form layers of **zinc-iron intermetallics** (gamma, delta, zeta) with a pure zinc (eta) layer on top — metallurgically bonded
9. **Withdraw**, drain, quench or air cool
10. **Inspect** coating thickness

Typical coating life: decades in rural air; shorter in industrial or marine air.

# Other zinc coatings
- **Electrogalvanizing** — zinc electroplated; thin, smooth (car panels)
- **Galvannealing** — galvanized sheet heated so iron-zinc alloys form throughout; paints well
- **Sherardizing** — zinc dust diffused in a rotating drum
- **Zinc spray (metallizing)**
- **Zinc-rich paint**
- **Galvalume** — 55% Al-Zn coating

! Welding or cutting galvanized steel makes **zinc oxide fume** → "metal fume fever." Ventilate or grind the coating off first.
`},
{t:'Anodizing', b:`
Thickening the natural **aluminum oxide (Al₂O₃)** layer electrochemically. The aluminum part is made the **anode** (hence the name).

# Steps
1. **Clean / degrease** (alkaline cleaner)
2. **Etch** in sodium hydroxide (satin finish) or chemical brighten (shiny)
3. **Desmut** — acid dip removes leftover alloy residue
4. **Anodize** — part is the anode in a **sulfuric acid** bath (about 15–20%), around 18–22 °C, DC current (typically about 12–20 V). Oxygen at the surface grows a porous oxide:
> 2Al + 3H₂O → Al₂O₃ + 6H⁺ + 6e⁻
5. **Dye** (optional) — the porous oxide soaks up colored dye
6. **Seal** — boiling deionized water or nickel acetate turns the oxide to boehmite and closes the pores
7. Rinse and dry

# Types
- **Type I** — chromic acid; thin; aerospace
- **Type II** — sulfuric acid; decorative and corrosion; about 5–25 µm
- **Type III (hard anodizing)** — sulfuric acid, cold (near 0 °C), higher voltage; thick (about 25–100 µm), very hard, wear-resistant

# Notes
- About half the coating grows into the metal and half out (dimension change)
- Works on aluminum, titanium (colors by interference), magnesium (special processes)
- The oxide is an **electrical insulator**
- 6xxx alloys anodize best; high-copper and high-silicon alloys anodize poorly
`},
{t:'Electroplating', b:`
Depositing a thin metal layer onto a part using electricity. The part is the **cathode**.

# The setup
- **Cathode** — the part
- **Anode** — usually a bar of the plating metal (dissolves to replace ions) or inert
- **Electrolyte** — solution of the plating metal's salt
- **DC power supply** (rectifier)
> At the part: Mⁿ⁺ + ne⁻ → M

# Steps
1. **Clean** — alkaline soak and electrocleaning (oil and grease)
2. **Rinse**
3. **Acid activate / pickle** — removes oxide
4. **Rinse**
5. **Strike** (thin first layer, e.g. nickel strike or copper cyanide strike) for adhesion
6. **Plate** at the right current density, temperature, and agitation
7. **Rinse, dry**
8. **Hydrogen bake** for high-strength steel (embrittlement relief)

# Common plating metals
- **Zinc** — sacrificial protection for bolts, then chromate/passivate
- **Nickel** — corrosion resistance, base for chrome
- **Chromium** — decorative (thin, over nickel) or **hard chrome** (thick, wear)
- **Copper** — base layer, electronics, electroforming
- **Tin** — food cans (tinplate), solderability
- **Gold** — electronics contacts, jewelry
- **Silver** — electrical contacts, tableware
- **Cadmium** — aerospace fasteners (toxic; being replaced)
- **Rhodium** — white gold jewelry brightness

# Plating amount (Faraday's law)
Thickness depends on current, time, and efficiency. Edges and corners get thicker deposits (current crowds there); recesses get less (**throwing power**).

# Electroless plating
No electricity: chemical reducing agent deposits the metal evenly everywhere (**electroless nickel** with phosphorus). Uniform on complex shapes.
`},
{t:'Cathodic Protection', b:`
Making the whole structure the **cathode** so it can't corrode. Used on pipelines, ship hulls, storage tanks, water heaters, offshore platforms, rebar in concrete.

# 1. Sacrificial (galvanic) anode system
Attach blocks of a **more active metal** that corrode instead of the steel.
- **Zinc** — seawater
- **Aluminum** (with indium or zinc) — seawater, offshore
- **Magnesium** — high-resistance soils and fresh water (highest driving voltage)
- The anodes are used up and must be **replaced**.
- Example: zinc anodes on boat hulls and outboard motors; magnesium rod in a water heater.

# 2. Impressed current cathodic protection (ICCP)
A **DC power source (rectifier)** pushes current from inert anodes (graphite, high-silicon cast iron, mixed metal oxide on titanium) through the soil or water to the structure.
- Protects long pipelines and large structures
- Adjustable; anodes last a long time
- Must be monitored; reversed wiring makes it *corrode* the structure

# Checking it
Measure the structure's potential against a **reference electrode** (copper/copper sulfate in soil, silver/silver chloride in seawater). A common criterion for steel: about **−850 mV or more negative** vs Cu/CuSO₄.

Usually combined with **coatings** — coating does most of the work; CP protects the holidays (defects).

# Anodic protection (less common)
Holds certain metals (stainless, steel in strong sulfuric acid) at a potential where they stay passive.
`},
{t:'Inhibitors, Design & Material Choice', b:`
# Corrosion inhibitors
Chemicals added in small amounts to the environment.
- **Anodic inhibitors** — chromates, nitrites, molybdates — help form passive films
- **Cathodic inhibitors** — zinc salts, polyphosphates — slow the cathode reaction
- **Film-forming (organic) inhibitors** — amines — coat the metal; oil and gas pipelines
- **Vapor phase (VCI)** — in packaging
- **Oxygen scavengers** — sulfite, hydrazine in boiler water
- **pH control** — keeping water alkaline

# Design against corrosion
- Avoid crevices and pockets where water sits; allow drainage
- Avoid dissimilar metal contact or insulate it
- Weld instead of bolt or rivet where possible
- Round corners (better coating coverage)
- Allow access for inspection and painting
- Add corrosion allowance

# Material selection
- Seawater: 316, duplex, titanium, cupronickel, aluminum bronze
- Acids: specific stainless and nickel alloys, plastics, rubber linings
- High temperature: chromium- and aluminum-containing alloys
- Buried: coated steel with cathodic protection, ductile iron with polyethylene wrap
`}

GF.sec({id:'apps', title:'Real-World Uses', sub:'Where each metal goes and why', topics:[
{t:'Automotive', b:`
- **Frame and body** — mild and **advanced high-strength steels** (dual-phase, press-hardened boron steel for crash zones); **aluminum** (5xxx, 6xxx) for hoods and full bodies to save weight
- **Engine block** — **gray or compacted graphite cast iron**, or cast **aluminum** (A356, 319) with iron liners
- **Crankshaft** — forged steel (4140) or ductile iron
- **Pistons** — aluminum-silicon alloys
- **Brake rotors** — gray cast iron (damps vibration, conducts heat)
- **Exhaust** — ferritic stainless (409)
- **Catalytic converter** — **platinum, palladium, rhodium** (biggest use of PGMs)
- **Wiring** — copper
- **Steering wheel, seat frames** — magnesium (AM60)
- **Batteries** — lead-acid (lead); EVs: lithium, nickel, cobalt, manganese, copper, aluminum
- **Bearings** — 52100 steel; **springs** — 5160, 9260
- **Galvanized** or electrogalvanized body panels against rust
`},
{t:'Aircraft & Aerospace', b:`
- **Fuselage skin** — aluminum **2024-T3** (fatigue resistance), Al-Li alloys, composites
- **Wing spars and frames** — **7075-T6** and 7050 aluminum
- **Landing gear** — ultra-high-strength steel (**300M, 4340**) and titanium
- **Engine fan and compressor** — **Ti-6Al-4V**
- **Turbine blades (hottest)** — **nickel superalloys**, cast as **single crystals**, with thermal barrier coatings
- **Fasteners** — titanium, A286, alloy steel (cadmium or other coatings)
- **Electrical contacts** — gold-plated connectors (no tarnish)
- **Rockets** — aluminum-lithium tanks, Inconel, copper alloys for combustion chambers

Why: **strength-to-weight ratio**, fatigue resistance, and heat resistance decide everything in aerospace.
`},
{t:'Construction & Infrastructure', b:`
- **Structural beams** — hot-rolled carbon steel (A36, A992)
- **Rebar** — carbon steel (sometimes epoxy-coated or galvanized; stainless for bridges in salt)
- **Bridges** — HSLA and **weathering steel**
- **Bolts** — medium-carbon quenched and tempered steel; galvanized for outdoors
- **Roofing and siding** — galvanized or Galvalume steel, aluminum, copper (green **patina**), zinc
- **Windows and doors** — extruded aluminum (6063)
- **Plumbing** — copper pipe, brass fittings, ductile iron water mains, PEX
- **Wiring** — copper (and aluminum for large feeders)
- **Pipelines** — API 5L steel with coatings and cathodic protection
- **Fire sprinklers** — fusible bismuth alloys
`},
{t:'Electronics & Electrical', b:`
- **Wires and busbars** — **copper** (and aluminum for power lines — light, cheap; usually steel-reinforced)
- **Contacts and connectors** — **gold** plating (no oxide), silver, phosphor bronze and beryllium copper springs
- **Solder** — SAC305 (tin-silver-copper)
- **Circuit boards** — copper traces, tin/gold finishes
- **Chips** — ultra-pure **silicon**; copper interconnects; gold bond wires
- **Capacitors** — tantalum, aluminum
- **Magnets** — neodymium-iron-boron (rare earth), ferrite, alnico
- **Transformer cores** — silicon electrical steel
- **Batteries** — lithium, cobalt, nickel, manganese, graphite, copper and aluminum foil
- **Heat sinks** — aluminum, copper
- **Screens** — indium tin oxide

E-waste is now a rich "ore" — a tonne of circuit boards can hold more gold than a tonne of typical gold ore.
`},
{t:'Tools & Machinery', b:`
- **Hand tools** (wrenches, sockets) — forged **chrome-vanadium** or **chrome-moly** steel
- **Hammers, chisels, punches** — shock-resisting tool steel (S7), medium/high carbon steel
- **Drill bits** — **high-speed steel** (M2), cobalt HSS, **tungsten carbide**
- **Cutting inserts** — coated carbide, ceramics, CBN
- **Dies and molds** — D2, A2, H13, P20
- **Knives** — 1095, 440C, VG-10, powder steels
- **Files** — high-carbon steel, hardened to about HRC 62+
- **Gears and shafts** — 4140, 8620 (carburized), 4340
- **Bearings** — 52100 steel; bronze bushings
- **Machine beds** — gray cast iron (damping)
- **Mining** — manganese steel (Hadfield — work hardens under impact), high-chrome white iron mill liners, forged steel grinding balls
- **Non-sparking tools** — aluminum bronze, beryllium copper (for explosive atmospheres)
`},
{t:'Marine & Offshore', b:`
- **Hulls** — steel with coatings and cathodic protection; aluminum 5083 for fast boats
- **Propellers** — **nickel-aluminum bronze**, manganese bronze, stainless
- **Shafts** — stainless, duplex, Monel (nickel-copper)
- **Seawater piping and heat exchangers** — **cupronickel (90-10, 70-30)**, titanium, super duplex
- **Fasteners and fittings** — 316 stainless, silicon bronze
- **Sacrificial anodes** — zinc, aluminum, magnesium
- **Offshore platforms** — high-strength steel, impressed current CP, sacrificial anodes

The big enemy is **chloride**: pitting, crevice corrosion, galvanic corrosion.
`},
{t:'Energy & Power', b:`
- **Power plant boilers** — chromium-molybdenum steels (creep resistance), stainless
- **Gas turbines** — nickel superalloys
- **Nuclear** — zirconium alloy fuel cladding (low neutron absorption), stainless, nickel alloys
- **Wind turbines** — steel towers, cast iron hubs, copper windings, rare earth magnets
- **Solar** — silicon wafers, silver contacts, aluminum frames, copper wiring
- **Transmission lines** — aluminum conductor steel-reinforced (ACSR)
- **Oil and gas** — API pipe steels, corrosion-resistant alloys (CRAs) for sour gas (H₂S), Inconel
- **Hydrogen** — steels must resist hydrogen embrittlement
- **Batteries** — lithium, nickel, cobalt, manganese, vanadium (flow batteries)
`},
{t:'Household & Everyday', b:`
- **Cookware** — stainless (often clad with aluminum or copper core for heat spread), cast iron, aluminum (anodized), copper
- **Cutlery** — martensitic stainless (420, 440)
- **Sinks** — 304 stainless
- **Cans** — aluminum (3004 body, 5182 lid); steel cans with tin plating (tinplate)
- **Foil** — 1xxx aluminum
- **Coins** — copper-nickel, copper-plated zinc (US penny), brass, steel
- **Jewelry** — karat gold, sterling silver, platinum, titanium, stainless
- **Keys and locks** — free-cutting brass
- **Zippers, buttons** — brass, zinc die cast
- **Appliances** — painted steel, 430 stainless trim, copper refrigerant tubing
- **Batteries** — zinc, manganese dioxide, lithium
- **Musical instruments** — brass (horns), bronze (cymbals, bells), nickel silver, steel strings
`},
{t:'How to Pick a Metal (Selection Process)', b:`
Engineers follow a logical path to pick a material.

1. **Define the job** — loads (tension, compression, impact, cycles), temperature, environment, life needed
2. **List must-haves** — e.g. strength over X MPa, non-magnetic, food-safe, conductive
3. **Screen out** metals that fail any must-have
4. **Rank** the rest by key properties per weight or per dollar (strength-to-weight, stiffness, corrosion rate)
5. **Check manufacturing** — can it be cast, welded, machined, formed in the shape needed?
6. **Check cost and availability**
7. **Plan protection** — coating, plating, CP, heat treatment
8. **Prototype and test**

# Quick guide
- Cheap and strong → **carbon steel**
- Strong and light → **aluminum, titanium, magnesium**
- Won't rust → **stainless, aluminum, titanium, copper alloys**
- Conducts electricity → **copper, aluminum, silver, gold**
- Hot service → **Cr-Mo steel, stainless, nickel superalloys**
- Cold service (cryogenic) → **FCC metals**: austenitic stainless, aluminum, copper, nickel steels
- Wear → **hardened tool steel, white iron, carbides, hard chrome**
- Complex cast shape → **cast iron, aluminum, zinc die cast, bronze**
- Bearings and low friction → **bronze, babbitt, 52100**
- Body implants → **titanium, cobalt-chrome, 316L**
`}
