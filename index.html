GF.sec({id:'workout', title:'Work Out Any Metal', sub:'A decision path for any ore', topics:[
{t:'The 8 Questions (Decision Path)', b:`
Use these questions in order to reason out how to assay, extract, and refine **any** metal — even one not in this app.

# 1. What mineral is the metal in?
- **Native** (already metal: Au, Ag, Cu, Pt) → physical separation (gravity), then leach or melt
- **Oxide** (hematite, cassiterite, bauxite, rutile) → reduce directly (carbon, hydrogen, electrolysis) or leach
- **Sulfide** (chalcopyrite, galena, sphalerite, pentlandite, molybdenite) → flotation, then **roast** or **matte smelt**, or pressure leach
- **Carbonate** (malachite, siderite, smithsonite) → calcine to oxide or acid leach
- **Silicate** (beryl, garnierite, spodumene) → hard; needs high-temperature cracking or strong acid
- **Chloride/brine** (Mg, Li, Na, K) → evaporation, precipitation, electrolysis

# 2. How reactive is the metal? (Ellingham / reactivity series)
- **Low reactivity** (Au, Ag, Pt, Cu) → easy; often native; mild reduction
- **Medium** (Fe, Zn, Pb, Sn, Ni) → **carbon smelting** works
- **High** (Al, Mg, Ti, Li, Na, Ca) → **electrolysis** of a molten salt or **metallothermic** reduction (Mg, Al, Ca, Si as reducer)
- **Refractory metals** (W, Mo) → **hydrogen** reduction to powder

# 3. What's the grade?
- Very low (g/t, like gold) → leaching whole ore (heap or tank); concentrate first if possible
- Low % (copper, nickel, moly) → **concentrate** by flotation/gravity/magnetic before smelting
- High % (iron ore, bauxite) → feed almost directly

# 4. What physical differences can separate the mineral?
- **Density** difference → gravity
- **Surface chemistry** → flotation
- **Magnetism** → magnetic separation
- **Conductivity** → electrostatic
- **Size/hardness** → screening, attrition

# 5. Does it dissolve in something cheap?
- **Acid** (H₂SO₄, HCl) → Cu oxides, Zn calcine, Ni laterite, U
- **Alkali** (NaOH) → Al (Bayer), W
- **Cyanide** → Au, Ag
- **Ammonia** → Ni, Cu, Co
- **Chloride/chlorine** → Au, PGMs, Ti (as TiCl₄)
If yes → hydrometallurgy: leach → purify (SX, IX, precipitation) → recover (electrowinning, cementation, precipitation)

# 6. How volatile is it?
- Low boiling metals (Zn 907 °C, Cd 767 °C, Hg 357 °C, Mg 1091 °C) → **distillation / condensation** routes
- Volatile compounds (TiCl₄, Ni(CO)₄, MoO₃, As₂O₃) → use them to separate

# 7. What are the impurities and by-products?
- Precious metals follow copper, lead, and nickel → recovered from **anode slime, Parkes crust, matte**
- Toxic elements (As, Hg, Cd, Sb, Pb) → must be captured and stabilized
- Sulfur → SO₂ → sulfuric acid plant

# 8. What purity does the market need?
- Steel alloying → **ferroalloy** is fine
- Electrical copper, battery nickel, bullion → **electrolytic** or chemical refining

Hook: **"Mineral, Reactivity, Grade, Separate, Dissolve, Volatile, Impurities, Purity"** — **"My Rock Gives Silver Dollars Very Instant Profit."**
`},
{t:'Choosing an Assay Method', b:`
# Precious metals (Au, Ag, Pt, Pd)
- **Fire assay** — the standard
- Gravimetric finish for high grade; AAS or ICP finish for low grade
- Nickel sulfide fire assay for all six PGMs
- Screen fire assay for coarse gold
- Cyanide leach assays (bottle roll) to see recoverable gold

# Base metals (Cu, Pb, Zn, Ni, Co, Mo)
- **Aqua regia or four-acid digest + AAS / ICP-OES**
- Concentrates and high grades: titration (iodometric Cu, EDTA Zn/Pb), electrogravimetric Cu
- Quick screening: XRF (handheld or lab)

# Iron, manganese, aluminum, major elements
- **Fused-bead XRF** (sample melted with lithium borate into a glass disk)
- Wet titration for iron (dichromate)

# Oxide minerals that resist acid (cassiterite, chromite, rutile, zircon)
- **Fusion** with sodium peroxide or lithium borate first, then ICP or XRF — plain acid won't dissolve them

# Trace and pathfinder elements (As, Sb, Bi, Te, Hg)
- Aqua regia + **ICP-MS** (multi-element packages)
- Mercury by cold-vapor AAS

# Field / quick checks
- Panning (gold), UV lamp (scheelite), handheld XRF, streak and hardness tests, magnet
`},
{t:'Field Identification of Metals & Minerals', b:`
# Ore mineral tests
- **Streak** — rub on unglazed porcelain: gold = golden yellow; pyrite = greenish-black; hematite = red-brown; magnetite = black; galena = lead-gray; chalcopyrite = greenish-black; cinnabar = red
- **Hardness** — Mohs scale with fingernail, coin, knife, glass
- **Specific gravity** — heft or weigh in air and water:
> SG = weight in air ÷ (weight in air − weight in water)
- **Magnetism** — magnetite and pyrrhotite are magnetic
- **Luster, color, crystal shape, cleavage**
- **Fizz test** — carbonates bubble in dilute HCl
- **UV fluorescence** — scheelite glows blue-white

# Gold vs fool's gold vs chalcopyrite
- **Gold** — soft (knife cuts it), malleable (flattens with a hammer), golden-yellow streak, stays bright yellow in any light, very heavy, not brittle
- **Pyrite** — hard (Mohs 6+), brittle, cubic crystals, greenish-black streak, often brassy-pale
- **Chalcopyrite** — brassy, softer than pyrite (3.5–4), greenish-black streak, often tarnished iridescent
- **Weathered mica** — flaky, light, golden-looking in water; floats around in a pan

# Scrap metal identification
- **Magnet** — sticks to carbon steel, cast iron, ferritic/martensitic stainless, nickel; not to aluminum, copper, brass, 300-series stainless, titanium (and only weakly to cold-worked 304)
- **Color** — copper red, brass yellow, bronze reddish-brown, aluminum gray-white, zinc blue-gray, lead dull gray (soft, scratches with fingernail)
- **Weight** — aluminum feels light; lead, tungsten very heavy
- **Spark test** (grinding wheel):
- Low carbon steel — long, straight yellow streaks, few forks
- High carbon steel — many bushy, star-like bursts
- Cast iron — short red streaks, small bursts
- Stainless — short orange-red streaks, few bursts
- Tool steel (with W) — dull red, broken streaks
- Nickel, aluminum, copper — no sparks (or none useful)
- **File test** — hardness
- **Chemical spot tests and handheld XRF** — exact alloy

# Precious metal testing
- **Touchstone and acid test** — rub on a black stone, apply nitric or graded aqua regia test acids; the streak's reaction shows karat
- **Specific gravity** — gold 19.3; 18K about 15.5; 14K about 13; silver 10.5
- **XRF** — surface reading (plating can fool it)
- **Fire assay** — the final, legal answer
- **Ultrasonic / conductivity** — catches tungsten-core fakes
`},
{t:'Process Flow Templates', b:`
Use these as a starting skeleton, then adjust for the specific ore.

# Native / free metal (gold, placer tin)
Mine → crush/grind → **gravity** → (leach tailings) → smelt concentrate → refine

# Oxide ore, medium reactivity (iron, tin)
Mine → crush → concentrate (gravity/magnetic) → **agglomerate** (sinter/pellet) → **carbon smelt** with flux → refine (oxidize impurities) → cast

# Oxide ore, high reactivity (aluminum)
Mine → **chemical purification to pure oxide** (Bayer) → **molten salt electrolysis** → cast

# Oxide ore, acid soluble (copper oxides, nickel laterite)
Mine → crush → **acid leach** (heap or autoclave) → **solvent extraction** → **electrowinning**

# Sulfide ore, matte route (copper, nickel)
Mine → grind → **flotation** → **smelt to matte** → **convert** → fire refine → **electrorefine** → recover precious metals from slime

# Sulfide ore, roast-leach route (zinc)
Mine → grind → **flotation** → **roast** to oxide → **acid leach** → purify (cementation) → **electrowin**

# Sulfide ore, roast-reduce route (lead, molybdenum)
Flotation → **roast** to oxide → **reduce** (carbon for Pb, hydrogen for Mo) → refine

# Very reactive metal from chloride (titanium, zirconium, magnesium)
Ore → **chloride** (TiCl₄) or brine → purify by distillation → **reduce with Mg or Na**, or **electrolyze** → vacuum melt

# Refractory metal (tungsten, molybdenum)
Concentrate → **chemical conversion to pure oxide** (APT, MoO₃) → **hydrogen reduction** to powder → **press and sinter**

# Low-grade precious metal (gold, silver)
Mine → crush/grind (or heap) → **cyanide leach** → carbon or zinc recovery → **electrowin** → **smelt to doré** → refine
`}
]});

GF.sec({id:'math', title:'Math & Conversions', sub:'Every formula and unit in one place', topics:[
{t:'Weight & Unit Conversions', b:`
# Precious metal weights
- 1 troy ounce (ozt) = **31.1035 g**
- 1 troy ounce = 20 pennyweights (dwt) = 480 grains
- 1 pennyweight = 1.5552 g
- 1 grain = 0.0648 g
- 1 troy pound = 12 troy oz = 373.24 g
- 1 kilogram = **32.1507 troy oz**
- 1 avoirdupois (regular) ounce = 28.3495 g = 0.9115 troy oz
- 1 avoirdupois pound = 14.583 troy oz

# Tons
- 1 short ton (US) = 2,000 lb = **907.185 kg**
- 1 metric tonne = 1,000 kg = 2,204.6 lb = 1.1023 short tons
- 1 long ton (UK) = 2,240 lb = 1,016 kg

# Grade conversions
- 1 g/t = 1 ppm = 1,000 ppb
- 1% = 10,000 ppm = 10,000 g/t
- **1 oz/short ton = 34.2857 g/t**
- **1 g/t = 0.02917 oz/short ton**
- 1 oz/metric tonne = 31.1035 g/t
- 1 g/t = 0.03215 oz/metric tonne
- **Assay ton (AT) = 29.1667 g** → mg of gold = oz/short ton

# Temperature
> °F = °C × 9/5 + 32
> °C = (°F − 32) × 5/9
> K = °C + 273.15
Examples: gold melts 1064 °C = 1947 °F; steel hardening 830 °C ≈ 1525 °F; zinc bath 450 °C = 842 °F.

# Length
- 1 inch = 25.4 mm · 1 mm = 0.03937 in · 1 mil = 0.001 in = 25.4 µm · 1 µm = 0.001 mm

# Pressure / stress
- 1 MPa = 145 psi · 1 ksi = 6.895 MPa · 1 atm = 101.3 kPa = 14.7 psi · 1 bar = 100 kPa

# Mesh vs microns (Tyler / US approximate)
- 10 mesh ≈ 2 mm · 20 mesh ≈ 850 µm · 35 mesh ≈ 500 µm · 60 mesh ≈ 250 µm · 100 mesh ≈ 150 µm · 150 mesh ≈ 106 µm · **200 mesh ≈ 75 µm** · 325 mesh ≈ 45 µm · 400 mesh ≈ 38 µm
`},
{t:'Grade, Tonnage & Value Formulas', b:`
> Tonnes = Volume (m³) × Specific gravity (t/m³)
> Contained metal (g) = Tonnes × Grade (g/t)
> Troy oz = grams ÷ 31.1035
> Recovered metal = Contained metal × Recovery (as a decimal)
> Value of rock per tonne = Grade × Recovery × Price per gram
> Cut-off grade = Cost per tonne ÷ (Price per gram × Recovery)

# Grade from an assay
> Grade (g/t) = Metal mass (mg) ÷ Sample mass (g) × 1000

# Average (weighted) grade
When samples are different lengths or weights, weight the grades:
> Average = Σ (grade × length) ÷ Σ length

Example drill hole intervals: 2 m @ 1.5 g/t, 3 m @ 6.0 g/t, 1 m @ 0.4 g/t
> (2×1.5 + 3×6.0 + 1×0.4) ÷ 6 = 21.4 ÷ 6 = **3.57 g/t over 6 m**

# Gram-meters (drill intercept strength)
> Grade × Width — e.g. 3.57 g/t × 6 m = 21.4 gram-meters

# Strip ratio
> Strip ratio = Waste tonnes ÷ Ore tonnes

# Dilution
> Diluted grade = (Ore t × ore grade + Waste t × waste grade) ÷ (Ore t + Waste t)
`},
{t:'Metallurgical Balance Formulas', b:`
# Recovery (simple, when tonnage barely changes — leaching)
> Recovery % = (Head grade − Tail grade) ÷ Head grade × 100

# Two-product formula (concentration — flotation, gravity)
f = feed grade, c = concentrate grade, t = tailings grade
> Recovery % = c × (f − t) ÷ [ f × (c − t) ] × 100
> Ratio of concentration = (c − t) ÷ (f − t)
> Mass pull (concentrate weight %) = (f − t) ÷ (c − t) × 100

# Leach extraction (from solution)
> Extraction % = Metal in solution ÷ (Metal in solution + Metal in residue) × 100

# Solution metal
> Metal in solution (g) = Concentration (mg/L) × Volume (m³)   [since 1 mg/L × 1 m³ = 1 g]

# Pulp density (slurry)
> % solids by weight = Dry solids mass ÷ Total slurry mass × 100
> Slurry SG = 100 ÷ [ (% solids ÷ solids SG) + (100 − % solids) ]

Example: 45% solids, ore SG 2.7 → slurry SG = 100 ÷ (45/2.7 + 55) = 100 ÷ 71.67 ≈ **1.40**

# Reagent consumption
> kg/t = kg reagent added ÷ dry tonnes treated

# Carbon loading
> Gold on carbon (g/t carbon) = gold adsorbed (g) ÷ carbon (t)

# Residence time in tanks
> Time (h) = Total tank volume (m³) ÷ Slurry flow (m³/h)
`},
{t:'Chemistry Formulas', b:`
# Moles
> Moles = Mass (g) ÷ Molar mass (g/mol)
> Mass = Moles × Molar mass

# Percent of metal in a mineral
> % metal = (atoms of metal × atomic mass) ÷ molar mass of mineral × 100

# Concentration
> Molarity (M) = moles ÷ liters of solution
> mg/L = ppm (in water)
> % w/v = grams per 100 mL

# Dilution
> C₁ × V₁ = C₂ × V₂
Example: make 1 L of 10% NaCN solution from 30% stock → V₁ = 10 × 1 ÷ 30 = 0.333 L stock + water to 1 L.

# pH
> pH = −log[H⁺]
> pH + pOH = 14

# Faraday's law (electrowinning, plating)
> Mass (g) = I × t × M ÷ (n × F) × current efficiency
I in amps, t in seconds, M molar mass, n electrons, F = 96,485 C/mol

# Gibbs free energy
> ΔG = ΔH − TΔS   (negative = can happen)

# Ideal gas (furnace gas volumes)
> PV = nRT   (R = 8.314 J/mol·K; 1 mole of gas at 0 °C, 1 atm = 22.4 L)
`},
{t:'Mechanical & Heat Formulas', b:`
# Stress, strain, modulus
> Stress σ = F ÷ A₀
> Strain ε = ΔL ÷ L₀
> E = σ ÷ ε
> % Elongation = (L_f − L₀) ÷ L₀ × 100
> % Reduction of area = (A₀ − A_f) ÷ A₀ × 100

# Hardness
> Vickers HV = 1.854 × F ÷ d² (F in kgf, d in mm)
> Steel: UTS (MPa) ≈ 3.45 × HB (rough)

# Cold work
> % CW = (A₀ − A_f) ÷ A₀ × 100

# Lever rule (phase fractions)
> Fraction of phase α = (C_β − C₀) ÷ (C_β − C_α)

# Heat needed to melt (approx.)
> Q = m × c × ΔT + m × L_f
m = mass, c = specific heat, ΔT = temperature rise, L_f = latent heat of fusion

# Thermal expansion
> ΔL = α × L₀ × ΔT
(steel α ≈ 12 × 10⁻⁶ per °C; aluminum ≈ 23 × 10⁻⁶; copper ≈ 17 × 10⁻⁶)

# Diffusion depth (rule of thumb)
> Depth ∝ √(time) — double the depth needs four times the time

# Grinding energy (Bond)
> W (kWh/t) = 10 × Wi × (1/√P80 − 1/√F80)

# Carbon equivalent (weldability)
> CE = C + Mn/6 + (Cr + Mo + V)/5 + (Ni + Cu)/15

# Karat and fineness
> Fineness = Karat ÷ 24 × 1000
> Gold content (g) = Item weight × Karat ÷ 24
Example: 10 g of 14K → 10 × 14/24 = **5.83 g gold**
`}
]});

GF.sec({id:'safety', title:'Safety', sub:'Hazards in the lab, mill, and smelter', topics:[
{t:'General Lab & Shop Safety', b:`
- **Read the SDS** (safety data sheet) for every chemical before you use it
- **PPE** every time: safety glasses or goggles, face shield for pouring and acids, lab coat or FR clothing, gloves suited to the job (nitrile for chemicals, leather/aluminized for heat), closed-toe safety boots
- **Fume hood** for acids, cyanide, lead fusion and cupellation, mercury
- **Never eat, drink, or smoke** in the lab; wash hands before leaving
- Know where the **eyewash, safety shower, fire extinguishers, first aid, and spill kit** are
- **Label** every container
- **Never work alone** with cyanide, HF, or molten metal
- Keep a clean, uncluttered bench
- Report every injury and near miss

# Fire classes
- **A** — wood, paper · **B** — flammable liquids · **C** — electrical · **D** — combustible **metals** (Mg, Ti, Li, Na, Zr, Al powder) · **K** — kitchen oils
Never use water on a metal fire. Use Class D powder or dry sand.
`},
{t:'Molten Metal & Furnace Safety', b:`
- **Water + molten metal = steam explosion.** A few drops of water trapped under molten metal turn into steam about 1,600 times larger and blast metal everywhere.
- **Dry and preheat** every tool, mold, crucible, ladle, and addition (scrap, flux, ingots)
- Never charge wet or frozen scrap; watch for sealed containers (they explode)
- **PPE**: face shield over safety glasses, aluminized or wool jacket and leggings, leather gloves, spats/boot covers, no synthetic clothing (melts into skin), no cuffs that catch metal
- Keep the pouring area **dry and clear** (sand floor in foundries)
- Use proper **tongs and shanks** that fit the crucible
- **Inspect crucibles** for cracks and thinning
- Furnace gases: **CO** is odorless and deadly — use CO monitors
- **Infrared and UV** from molten metal and arcs can burn eyes — use shaded lenses where needed
- Burns: cool with water (on skin, not on molten metal), get medical help

# Fire assay specifics
- Load and pour crucibles with long tongs, face shield, and aluminized apron
- Pour in one smooth motion into a **dry, preheated** mold
- Lead fumes during fusion and cupellation → fume extraction
- Hot crucibles and cupels look the same as cold ones — mark and treat everything as hot
`},
{t:'Cyanide Safety', b:`
Sodium cyanide is one of the most dangerous chemicals in metallurgy. Small amounts can kill.

# How it harms
Cyanide blocks the body's ability to use oxygen in cells (cytochrome c oxidase). Enters by **swallowing, breathing HCN gas, or through skin and eyes**.

# The #1 rule
**Keep cyanide alkaline — pH above 10.5. Never let it touch acid.** Acid + cyanide → **HCN gas**.
- Separate cyanide areas from acid storage and acid-wash circuits
- Never mix waste streams
- Watch pH constantly; lime dosing alarms

# Symptoms of poisoning
Headache, dizziness, confusion, rapid breathing, nausea, then gasping, convulsions, collapse. Can happen in minutes.

# Controls
- **HCN gas monitors** (fixed and personal) with alarms
- Ventilation, buddy system, restricted access
- PPE: chemical goggles, face shield, nitrile/neoprene gloves, apron, respirator where required
- **Cyanide antidote kit** (hydroxocobalamin is common) and **trained first aiders** on site
- Emergency showers and eyewashes nearby
- Follow the **International Cyanide Management Code**

# First response (follow your site plan)
1. Raise the alarm; **don't become a victim** — use breathing apparatus if gas is present
2. Move the person to fresh air
3. Remove contaminated clothing; flush skin and eyes with lots of water
4. Give oxygen if trained; call emergency services
5. Antidote only by trained personnel per the site medical plan
6. **No mouth-to-mouth resuscitation** — use a bag-valve mask
`},
{t:'Lead, Mercury & Heavy Metals', b:`
# Lead (fire assay, smelting, batteries)
- Enters by **breathing fume/dust** and **swallowing** (hand-to-mouth)
- Harms the nervous system, kidneys, blood, reproduction; builds up over time
- **Controls**: fume hoods for fusion and cupellation, wet cleaning (no dry sweeping), HEPA vacuums, wash hands and face before eating, dedicated work clothes left at work, **blood lead level testing**
- Don't take contaminated clothes home (protects families and children)

# Mercury
- **Vapor** is the main danger; invisible and odorless; liquid mercury evaporates at room temperature
- Harms brain and kidneys; tremors, mood changes
- Retort amalgam and electrowinning sludge only in **sealed retorts with condensers and carbon filters**
- Spills: mercury spill kit (sulfur or zinc powder amalgamates it); never vacuum with a normal vacuum
- Urine mercury testing for exposed workers

# Arsenic
- Roasting arsenopyrite releases As₂O₃ — highly toxic and carcinogenic
- **Arsine gas** (AsH₃) can form when acid meets arsenic-bearing metal or dross — deadly
- Capture in baghouses; stabilize as scorodite

# Cadmium
- Fume from melting or brazing with cadmium-bearing alloys can cause fatal lung damage

# Hexavalent chromium
- Chrome plating mist, stainless welding fume → carcinogen; local exhaust ventilation

# Beryllium
- Dust or fume → chronic beryllium disease; strict controls

# Nickel carbonyl
- From the Mond process — extremely toxic gas
`},
{t:'Acids, Bases & Gases', b:`
# Acids
- **Always add acid to water**, slowly, stirring
- Nitric acid and aqua regia → **NO₂ (brown gas)** — fume hood
- **Aqua regia**: make fresh, small amounts; never seal in a bottle (pressure builds)
- **Hydrofluoric acid**: special training; calcium gluconate gel on hand; even small burns can be fatal
- Sulfuric acid dehydrates and chars; huge heat with water

# Bases
- NaOH, KOH, lime cause deep, painful burns, especially to **eyes** — chemical goggles
- Dissolving NaOH gets very hot

# Splashes
- Flush skin or eyes with water for **at least 15 minutes**; remove contaminated clothing; get medical help

# Gases
- **CO** — furnaces, coke; odorless; monitors
- **SO₂** — roasting and smelting; choking
- **HCN** — cyanide + acid
- **Cl₂** — Miller refining, chlorination
- **NO₂** — nitric acid
- **H₂** — from acids on metals, charging batteries; explosive
- **Arsine, stibine** — acids on arsenic or antimony materials
- **Zinc oxide fume** — welding galvanized steel (metal fume fever)

# Dust
- **Silica** (crushing, grinding, sample prep) → silicosis; use dust extraction and respirators
- Metal powders (Al, Mg, Ti) → explosion risk
`},
{t:'Mill & Mine Hazards', b:`
- **Lockout/tagout** before working on any machine (crushers, mills, conveyors, pumps)
- **Conveyor guards**; never reach into moving equipment
- **Noise** — crushers and mills need hearing protection
- **Confined spaces** — tanks, bins, thickeners: test the air, permit, attendant
- **Falls** — handrails, harnesses at height
- **Slurry and hot elution circuits** — high pressure and temperature
- **Explosives** — only licensed blasters
- **Ground falls** underground — scaling, bolting, inspections
- **Mobile equipment** — huge blind spots; stay visible and in safe zones
- **Heat stress** in smelters and hot climates
- **Radiation** — some mineral sands (monazite), density gauges, XRF instruments
`}
]});

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');}
function plain(s){return s.replace(/\*\*/g,'').replace(/^[#>!\-] ?/gm,'').replace(/^\d+\. /gm,'');}

/* Mini markup: "# " heading, "- " bullet, "1. " numbered, "> " equation slip, "! " safety box, **bold** */
function render(src){
  var lines=src.replace(/^\n+|\n+$/g,'').split('\n'), out=[], i=0;
  while(i<lines.length){
    var L=lines[i];
    if(/^\s*$/.test(L)){i++;continue;}
    if(L.indexOf('# ')===0){out.push('<h3>'+inl(L.slice(2))+'</h3>');i++;continue;}
    if(L.indexOf('> ')===0){var e=[];while(i<lines.length&&lines[i].indexOf('> ')===0){e.push('<div>'+inl(lines[i].slice(2))+'</div>');i++;}out.push('<div class="eq">'+e.join('')+'</div>');continue;}
    if(L.indexOf('! ')===0){out.push('<div class="warn">'+inl(L.slice(2))+'</div>');i++;continue;}
    if(L.indexOf('- ')===0){var u=[];while(i<lines.length&&lines[i].indexOf('- ')===0){u.push('<li>'+inl(lines[i].slice(2))+'</li>');i++;}out.push('<ul>'+u.join('')+'</ul>');continue;}
    if(/^\d+\. /.test(L)){var o=[],st=parseInt(L,10);while(i<lines.length&&/^\d+\. /.test(lines[i])){o.push('<li>'+inl(lines[i].replace(/^\d+\. /,''))+'</li>');i++;}out.push('<ol'+(st>1?' start="'+st+'"':'')+'>'+o.join('')+'</ol>');continue;}
    var p=[];while(i<lines.length&&!/^\s*$/.test(lines[i])&&!/^(# |> |! |- |\d+\. )/.test(lines[i])){p.push(inl(lines[i]));i++;}
    out.push('<p>'+p.join('<br>')+'</p>');
  }
  return out.join('');
}

  var j=s.toLowerCase().indexOf(q);return esc(s.slice(0,j))+'<span class="hl">'+esc(s.slice(j,j+q.length))+'</span>'+esc(s.slice(j+q.length));}
function showSearch(){
  view('<header class="head"><h1>Search</h1><p>Any term, metal, mineral, chemical, or formula.</p></header><input class="field" id="q" type="search" placeholder="e.g. cupel, Kroll, CuFeS₂, temper" autocomplete="off" value="'+esc(lastQ)+'"><ul class="hits" id="hits"></ul>');
  var q=document.getElementById('q'),hits=document.getElementById('hits');
  function run(){
    var v=q.value.trim().toLowerCase();lastQ=q.value;save('q',lastQ);
    if(v.length<2){hits.innerHTML='<li class="empty">Type at least two letters.</li>';return;}
    var words=v.split(/\s+/);
    var r=IDX.map(function(x){var sc=0;words.forEach(function(w){if(x.tl.indexOf(w)>=0)sc+=10;var c=x.bl.split(w).length-1;if(c)sc+=Math.min(c,5);else if(x.tl.indexOf(w)<0)sc=-999;});return {x:x,sc:sc};})
      .filter(function(o){return o.sc>0;}).sort(function(a,b){return b.sc-a.sc;}).slice(0,40);
    var g=GF.glossary.filter(function(e){return e[0].toLowerCase().indexOf(v)>=0;}).slice(0,6);
    var h=g.map(function(e){return '<li><button data-go="glossary"><span class="hs">Glossary</span><span class="ht">'+esc(e[0])+'</span><span class="hx">'+esc(e[1])+'</span></button></li>';}).join('');
    h+=r.map(function(o){return '<li><button data-go="t.'+o.x.k+'"><span class="hs">'+esc(o.x.sec)+'</span><span class="ht">'+esc(o.x.t)+'</span><span class="hx">'+snippet(o.x.body,o.x.bl,words[0])+'</span></button></li>';}).join('');
    hits.innerHTML=h||'<li class="empty">No matches. Try a shorter word or a chemical symbol.</li>';
  }
  q.oninput=run; run(); if(!lastQ)q.focus();
}

/* ---------- glossary ---------- */
function showGlossary(){
  var G=GF.glossary.slice().sort(function(a,b){return a[0].localeCompare(b[0]);});
  var letters=[];G.forEach(function(e){var c=e[0][0].toUpperCase();if(letters.indexOf(c)<0)letters.push(c);});
  view('<header class="head"><h1>Glossary</h1><p>'+G.length+' terms used in metallurgy.</p></header><input class="field" id="gq" type="search" placeholder="Filter terms" autocomplete="off"><div class="letters">'+letters.map(function(c){return '<button data-l="'+c+'">'+c+'</button>';}).join('')+'</div><dl class="gl" id="gl"></dl>');
  var gl=document.getElementById('gl'),gq=document.getElementById('gq');
  function draw(){var v=gq.value.trim().toLowerCase();
    gl.innerHTML=G.filter(function(e){return !v||e[0].toLowerCase().indexOf(v)>=0||e[1].toLowerCase().indexOf(v)>=0;})
      .map(function(e){return '<dt id="g-'+e[0][0].toUpperCase()+'">'+esc(e[0])+'</dt><dd>'+esc(e[1])+'</dd>';}).join('')||'<p class="empty">No terms match.</p>';}
  gq.oninput=draw;draw();
  app.querySelectorAll('[data-l]').forEach(function(b){b.onclick=function(){gq.value='';draw();var t=document.getElementById('g-'+b.dataset.l);if(t)t.scrollIntoView({behavior:'smooth',block:'start'});};});
}

/* ---------- delegated navigation ---------- */
app.addEventListener('click',function(e){var b=e.target.closest('[data-go]');if(b){e.preventDefault();go(b.dataset.go);}});

route();

/* ---------- offline (installed app only; ignored where not allowed) ---------- */
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&window.top===window.self){navigator.serviceWorker.register('sw.js').catch(function(){});}}catch(e){}
})();

</script>
