12. **Retort and calcine** sludge (remove mercury)
13. **Smelt** with borax, silica, niter → **doré bars**
14. **Ship to refinery** → Miller and/or Wohlwill → **99.99% gold**
15. **Detox tailings** → TSF

Refractory ores add: flotation → roasting / POX / BIOX → neutralize → then step 6.
Heap leach replaces steps 2–6 with: crush → agglomerate → stack → irrigate → collect PLS → carbon columns.
`}
]});

GF.sec({id:'extract', title:'Extraction & Smelting', sub:'Getting every kind of metal out of ore', topics:[
{t:'The 6 Basic Extraction Steps', b:`
1. **Mining** — removing ore from the earth (open pit, underground, placer, solution mining)
2. **Crushing & grinding (comminution)** — breaking ore into small particles to **liberate** the metal minerals
3. **Concentration (beneficiation)** — separating metal-rich minerals from waste rock (gangue) by gravity, flotation, magnetic, or electrostatic methods
4. **Smelting / extraction** — using heat and chemical reactions (or leaching and electricity) to turn the mineral into metal
5. **Refining** — removing impurities to reach the required purity
6. **Casting** — pouring molten metal into molds (ingots, slabs, billets, anodes, bars)

Hook: **"My Crew Can Smelt Really Cool"** — Mining, Crushing, Concentration, Smelting, Refining, Casting.

# Between concentration and smelting, sulfide ores often add:
- **Roasting** — heating in air to turn sulfides into oxides (and drive off sulfur as SO₂)
- **Sintering / pelletizing** — joining fine particles into lumps so furnace gases can flow through
`},
{t:'Concentration Methods (Beneficiation)', b:`
Separating valuable minerals from gangue before the expensive extraction step. Uses physical differences.

# By density — gravity
- Jigs, spirals, shaking tables, centrifugal concentrators, dense-medium separation (DMS)
- **Dense-medium separation**: ore is put in a heavy liquid (water + fine ferrosilicon or magnetite). Light gangue floats, heavy ore sinks. Used for coal, iron ore, diamonds.
- Works when SG difference is large (gold, tin cassiterite, tungsten minerals, mineral sands)

# By surface chemistry — froth flotation
- The main method for copper, lead, zinc, nickel, molybdenum sulfides
- **Differential (selective) flotation** floats one mineral at a time (e.g. lead first with zinc depressed, then activate zinc with CuSO₄ and float it)

# By magnetism — magnetic separation
- **Magnetite (Fe₃O₄)** is strongly magnetic → low-intensity drum separators
- Hematite, ilmenite, wolframite are weakly magnetic → high-intensity separators

# By electrical conductivity — electrostatic separation
- Separates conductors (rutile, ilmenite) from non-conductors (zircon, quartz) in mineral sands

# By appearance — sorting
- Hand sorting (historic), optical and X-ray **ore sorters** reject waste rock on a belt

# By size — screening and classification
- Screens and hydrocyclones split by particle size

# Dewatering
- **Thickeners** (settling tanks, with flocculants), **filters**, **dryers**
`},
{t:'Roasting & Sintering', b:`
# Roasting
Heating ore **below its melting point** in air to change its chemistry.

- **Oxidizing roast** — sulfide → oxide (most common)
> 2ZnS + 3O₂ → 2ZnO + 2SO₂
> 2PbS + 3O₂ → 2PbO + 2SO₂
> 2MoS₂ + 7O₂ → 2MoO₃ + 4SO₂
> 4FeS₂ + 11O₂ → 2Fe₂O₃ + 8SO₂
- **Sulfating roast** — makes water-soluble sulfates for leaching (some copper, cobalt)
- **Chloridizing roast** — adds salt to make chlorides
- **Salt roast** — vanadium: V₂O₅ + Na₂CO₃ → water-soluble sodium vanadate
- **Partial roast** — leaves some sulfide (for matte smelting)

Equipment: **fluidized-bed roasters** (air blown up through the ore so it acts like a boiling liquid), multiple-hearth roasters, rotary kilns.

**Calcine** = the roasted product. **Calcination** = heating to drive off CO₂ or water:
> CaCO₃ → CaO + CO₂ (limestone → lime)
> 2Al(OH)₃ → Al₂O₃ + 3H₂O

# SO₂ capture
Roaster and smelter off-gas SO₂ is cleaned and turned into **sulfuric acid** in an acid plant:
> 2SO₂ + O₂ → 2SO₃ (vanadium oxide catalyst)
> SO₃ + H₂O → H₂SO₄

# Sintering
Mixing fine ore, flux, and fuel, then burning it on a moving grate so particles partly fuse into porous lumps (**sinter**). Blast furnaces need lumpy, permeable feed.

# Pelletizing
Rolling fine iron concentrate with a binder (bentonite clay) into **pellets** about 10–15 mm, then firing them hard.
`},
{t:'Smelting: What Happens in the Furnace', b:`
**Smelting** = heating ore with a **reducing agent** and **flux** above the melting point so the metal separates as a liquid from the slag.

# The ingredients
- **Ore or concentrate** — supplies the metal
- **Reducing agent** — takes the oxygen (coke, CO, hydrogen, aluminum, silicon)
- **Flux** — combines with gangue to form a liquid **slag**
- **Heat** — fuel burning, electric arc, induction, or the reaction itself

# The products
- **Metal** (or matte) — dense, sinks
- **Slag** — lighter, floats; tapped off separately
- **Gases** — CO₂, CO, SO₂, dust (to gas cleaning)

# Why slag is so important
- Removes impurities (silica, alumina, lime, sulfur, phosphorus)
- Protects the metal from oxidizing
- Insulates and keeps heat in
- Must be **fluid** at furnace temperature, and lighter than the metal

# Two kinds of smelting
1. **Reduction smelting** — oxide ores reduced to metal (iron, tin, lead)
2. **Matte smelting** — sulfide ores melted into a **matte** (liquid sulfide mix, e.g. Cu₂S·FeS) then oxidized in a converter (copper, nickel)

# Furnace types
- **Blast furnace** — tall shaft; air blown in at the bottom; iron, some lead
- **Reverberatory furnace** — flame passes over a hearth (older copper)
- **Flash smelting furnace** — dry concentrate burns in oxygen-enriched air (copper, nickel)
- **Electric arc furnace (EAF)** — arcs from graphite electrodes; steel from scrap
- **Submerged arc furnace** — ferroalloys (ferrochrome, ferromanganese, silicon)
- **Induction furnace** — magnetic field heats metal; clean melting, precious metals, foundries
- **Crucible furnace** — small batches, labs, jewelers
- **Converter (Peirce-Smith, basic oxygen)** — oxygen blown through to oxidize impurities
- **Cupola** — small shaft furnace for melting cast iron
`},
{t:'Iron: The Blast Furnace', b:`
A blast furnace turns iron ore into liquid iron (**hot metal** or **pig iron**). It runs continuously for years.

# Charged from the top (in layers)
- **Iron ore** — hematite (Fe₂O₃), magnetite (Fe₃O₄) as sinter, pellets, or lump
- **Coke** — fuel and reducing agent (coal baked without air)
- **Limestone (CaCO₃)** or dolomite — flux

# Blown in at the bottom
- **Hot blast** — air preheated to about **1000–1250 °C** in stoves, through nozzles called **tuyeres**
- Often pulverized coal, natural gas, or oxygen injected too

# Reactions (from bottom to top)
1. Coke burns in front of the tuyeres (about 2000 °C):
> C + O₂ → CO₂
2. CO₂ meets hot coke and becomes CO (the real reducing gas):
> CO₂ + C → 2CO
3. Rising CO reduces iron ore step by step (hematite → magnetite → wüstite → iron):
> 3Fe₂O₃ + CO → 2Fe₃O₄ + CO₂
> Fe₃O₄ + CO → 3FeO + CO₂
> FeO + CO → Fe + CO₂
Overall: **Fe₂O₃ + 3CO → 2Fe + 3CO₂**
4. Some direct reduction by carbon lower down: FeO + C → Fe + CO
5. Limestone breaks down:
> CaCO₃ → CaO + CO₂
6. Lime fluxes the silica gangue into slag:
> CaO + SiO₂ → CaSiO₃
7. Iron picks up carbon as it trickles through the coke, lowering its melting point.

# Products
- **Hot metal**: about 93–95% Fe, **4–4.5% C**, plus Si, Mn, S, P. Brittle — needs steelmaking.
- **Slag** — sold as cement material and road base
- **Top gas** — CO-rich; burned in the stoves

# Furnace zones
- **Throat** (top) → **stack** (ore heats and reduces) → **belly/bosh** (ore softens and melts) → **hearth** (liquid iron and slag collect)
- Iron is **tapped** through a taphole every few hours; slag floats on top and is separated.

Hook: **"Coke Burns, CO Steals, Lime Cleans."**

# Direct reduced iron (DRI)
Iron ore reduced as a **solid** with natural gas or hydrogen (no melting):
> Fe₂O₃ + 3H₂ → 2Fe + 3H₂O
> Fe₂O₃ + 3CO → 2Fe + 3CO₂
Product: **sponge iron / DRI / HBI** — fed to electric arc furnaces. Hydrogen DRI is the leading low-carbon route.
`},
{t:'Steelmaking: BOF & EAF', b:`
Steel = iron with controlled, low carbon (usually under about 1%) and few impurities. Steelmaking **removes** carbon and impurities from hot metal by **oxidizing** them.

# Basic oxygen furnace (BOF)
1. Charge about 15–25% **scrap**, then pour in **hot metal**
2. Lower a water-cooled **lance**; blow **pure oxygen** at supersonic speed
3. Add **lime (CaO)** and dolomite as flux
4. Reactions (very exothermic — no fuel needed):
> 2C + O₂ → 2CO (carbon removed as gas)
> Si + O₂ → SiO₂ → into slag
> 2Mn + O₂ → 2MnO → into slag
> 4P + 5O₂ → 2P₂O₅; P₂O₅ + 3CaO → Ca₃(PO₄)₂ → into slag (needs basic slag)
5. Blow about 15–20 minutes; take temperature and sample
6. **Tap** into a ladle; add deoxidizers and alloys

"Basic" = the slag and the furnace lining (magnesia) are chemically basic, which is what removes phosphorus and sulfur.

# Electric arc furnace (EAF)
1. Charge mostly **scrap** (and/or DRI)
2. Lower **graphite electrodes**; strike an arc (about 3000 °C+)
3. Inject oxygen and carbon to make a **foamy slag** that shields the arc
4. Melt, refine, tap
- Uses electricity; the main way to recycle steel
- Smaller, flexible "mini-mills"

# Secondary (ladle) metallurgy
- **Deoxidizing** — oxygen left in the steel would form gas holes. Add aluminum or silicon:
> 2Al + 3O → Al₂O₃ (to slag)
> Si + 2O → SiO₂
**Killed steel** = fully deoxidized; **rimmed steel** = not deoxidized (historic)
- **Desulfurizing** — lime-based slags, calcium treatment
- **Vacuum degassing** — removes hydrogen and nitrogen
- **Alloy trimming** — add Mn, Cr, Ni, Mo, V to exact chemistry
- **AOD (argon-oxygen decarburization)** — for stainless steel; argon dilutes CO so carbon comes out without burning away chromium

# Casting steel
- **Continuous casting** — liquid steel poured into a water-cooled copper mold, pulled out as a solid strand, cut into slabs, blooms, or billets
- **Ingot casting** — older; poured into ingot molds
`},
{t:'Copper: Sulfide Smelting Route', b:`
About 80% of copper comes from sulfide ores (mainly **chalcopyrite, CuFeS₂**). Ore grade is often only about 0.5–1% Cu.

# Steps
1. **Mine, crush, grind**
2. **Froth flotation** → concentrate of about **20–30% Cu**
3. **Smelting (flash or bath smelting)** — concentrate burned with oxygen-enriched air and silica flux. Iron and sulfur partly oxidize; the heat from the reaction melts everything.
> 2CuFeS₂ + 4O₂ → Cu₂S + 2FeO + 3SO₂ (simplified)
> 2FeO + SiO₂ → Fe₂SiO₄ (fayalite slag)
Product: **matte** (Cu₂S·FeS mix) of about **50–70% Cu** + iron-silicate slag + SO₂ gas
4. **Converting (Peirce-Smith converter)** — air blown into the matte in two stages:
- **Slag blow**: iron sulfide oxidizes and slags off
> 2FeS + 3O₂ → 2FeO + 2SO₂
> 2FeO + SiO₂ → Fe₂SiO₄
- **Copper blow**: copper sulfide turns to copper metal
> Cu₂S + O₂ → 2Cu + SO₂
Product: **blister copper** (about 98.5–99.5% Cu) — named for the SO₂ blisters on its surface
5. **Fire refining (anode furnace)** — air removes the last sulfur; then natural gas or wood "poling" removes oxygen. Cast into **anodes** (about 99.5% Cu).
6. **Electrorefining** — anodes in **copper sulfate + sulfuric acid** electrolyte; pure copper plates onto stainless steel cathode blanks:
> Anode: Cu → Cu²⁺ + 2e⁻
> Cathode: Cu²⁺ + 2e⁻ → Cu
Product: **cathode copper, 99.99% Cu**
7. **Anode slime** falls to the bottom of the cells — contains **gold, silver, selenium, tellurium, platinum-group metals**. A major source of by-product gold and silver.
8. SO₂ → **sulfuric acid plant**

Hook: **"Float, Flash, Blow, Pole, Plate."**
`},
{t:'Copper: Leach-SX-EW Route', b:`
For **oxide copper ores** (malachite, azurite, chrysocolla, cuprite) and secondary sulfides (chalcocite). About 20% of world copper.

# Steps
1. **Heap leach** crushed ore with dilute **sulfuric acid** (raffinate):
> CuO + H₂SO₄ → CuSO₄ + H₂O
> Cu₂(OH)₂CO₃ + 2H₂SO₄ → 2CuSO₄ + CO₂ + 3H₂O (malachite)
Chalcocite needs bacteria and ferric iron to help oxidize it.
2. **Pregnant leach solution (PLS)** — weak copper sulfate (a few g/L Cu) with iron and other impurities
3. **Solvent extraction (SX)** — mix PLS with an organic **extractant** (oxime in kerosene). Copper moves into the organic; impurities stay in water.
> Cu²⁺ (aq) + 2RH (org) ⇌ R₂Cu (org) + 2H⁺ (aq)
4. **Strip** — strong sulfuric acid pulls copper back out of the organic into a clean, concentrated **electrolyte** (about 35–50 g/L Cu)
5. **Electrowinning (EW)** — inert lead-alloy anodes; copper plates on stainless steel cathodes:
> Cathode: Cu²⁺ + 2e⁻ → Cu
> Anode: 2H₂O → O₂ + 4H⁺ + 4e⁻
6. Acid regenerated at the anode returns to strip; raffinate returns to the heap

Product: **LME Grade A cathode** (99.99% Cu) with no smelter needed.

# Cementation (older, simple)
Copper solution run over scrap iron:
> Fe + CuSO₄ → FeSO₄ + Cu
`},
{t:'Aluminum: Bayer + Hall-Héroult', b:`
Aluminum is very reactive (bottom of the Ellingham diagram), so carbon can't reduce it. It needs two big processes.

# Step 1 — Bayer process: bauxite → alumina (Al₂O₃)
Bauxite = aluminum hydroxides (gibbsite Al(OH)₃, boehmite AlO(OH)) mixed with iron oxides, silica, titania.
1. **Grind** bauxite
2. **Digest** in hot concentrated **sodium hydroxide (NaOH)** under pressure (about 140–250 °C depending on ore):
> Al(OH)₃ + NaOH → NaAl(OH)₄ (sodium aluminate, dissolved)
3. **Clarify** — iron oxides, silica, titania stay solid as **red mud** (bauxite residue) and are settled out
4. **Precipitate** — cool the solution and seed with Al(OH)₃ crystals:
> NaAl(OH)₄ → Al(OH)₃ + NaOH
5. **Calcine** at about 1000–1100 °C:
> 2Al(OH)₃ → Al₂O₃ + 3H₂O
6. NaOH is recycled
About 4–5 t bauxite → 2 t alumina → 1 t aluminum (varies with ore).

# Step 2 — Hall-Héroult: alumina → aluminum
1. Alumina is **dissolved in molten cryolite (Na₃AlF₆)** at about **950–960 °C** (pure Al₂O₃ melts at 2072 °C — cryolite lowers it enormously)
2. Steel cell ("pot") lined with **carbon** = cathode; **carbon anodes** hang into the bath
3. Direct current (hundreds of thousands of amps, about 4–5 V per cell)
4. Aluminum ions reduce at the cathode; liquid aluminum collects on the bottom:
> Cathode: Al³⁺ + 3e⁻ → Al
5. Oxygen reacts with the carbon anode, which burns away and must be replaced:
> Anode: 2O²⁻ + C → CO₂ + 4e⁻
Overall: **2Al₂O₃ + 3C → 4Al + 3CO₂**
6. Liquid aluminum (about 99.7%) is siphoned out and cast
7. Aluminum fluoride (AlF₃) is added to adjust the bath chemistry

# Facts
- Uses about **13–15 kWh of electricity per kg** of aluminum — smelters are built near cheap power
- Recycling aluminum uses only about **5%** of that energy
- **Anode effect**: when alumina runs low, perfluorocarbon gases (strong greenhouse gases) form
- **Inert anodes** (that release oxygen, not CO₂) are being developed

Hook: **"Bayer Bakes the Bauxite, Hall Hauls out the Aluminum."**
`},
{t:'Zinc: Roast-Leach-Electrowin', b:`
Main ore: **sphalerite (ZnS)**, often with galena (PbS).

# RLE process (about 90% of zinc)
1. **Flotation** → zinc concentrate (about 50% Zn)
2. **Roast** in a fluidized bed at about 900–950 °C:
> 2ZnS + 3O₂ → 2ZnO + 2SO₂
SO₂ → acid plant
3. **Leach** calcine in sulfuric acid (spent electrolyte):
> ZnO + H₂SO₄ → ZnSO₄ + H₂O
4. **Iron removal** — iron precipitated as **jarosite, goethite, or hematite** (zinc ferrite needs hot acid leaching)
5. **Purification by cementation** — add **zinc dust** to drop out more noble metals (copper, cadmium, cobalt, nickel) that would ruin electrowinning:
> Zn + Cu²⁺ → Zn²⁺ + Cu
> Zn + Cd²⁺ → Zn²⁺ + Cd
6. **Electrowinning** — aluminum cathodes, lead-silver anodes:
> Cathode: Zn²⁺ + 2e⁻ → Zn
> Anode: 2H₂O → O₂ + 4H⁺ + 4e⁻
7. **Strip** zinc sheets every 1–2 days, melt, cast (Special High Grade, 99.995%)

Electrolyte must be extremely pure — traces of germanium, antimony, cobalt make hydrogen form instead of zinc.

# Imperial Smelting Process (pyrometallurgical)
Zinc-lead sinter + coke in a blast furnace. Zinc leaves as **vapor** (it boils at 907 °C) and is caught in a **lead splash condenser**; lead taps from the bottom.
> ZnO + C → Zn (gas) + CO

# Waelz kiln
Recovers zinc from EAF steel dust as zinc oxide fume.
`},
{t:'Lead: Smelting & Refining', b:`
Main ore: **galena (PbS)**.

# Smelting
1. **Flotation** → lead concentrate (about 50–75% Pb)
2. **Sinter-roast** — burn off sulfur, make lumpy sinter:
> 2PbS + 3O₂ → 2PbO + 2SO₂
3. **Blast furnace** with coke:
> PbO + CO → Pb + CO₂
> PbO + C → Pb + CO
4. Modern: **direct smelting** (QSL, Kivcet, ISASMELT) does both in one furnace

Product: **bullion lead** containing Cu, Sb, As, Sn, Ag, Au, Bi

# Pyro-refining (in kettles, step by step)
1. **Drossing** — cool to near freezing; copper floats as dross (add sulfur to remove the rest)
2. **Softening** — blow air or add NaNO₃/NaOH (Harris process) to oxidize Sb, As, Sn (they make lead hard, hence "softening")
3. **Parkes process (desilvering)** — add **zinc**. Silver and gold dissolve far more in zinc than in lead; the zinc-silver-gold crust floats and is skimmed. Zinc is distilled off; silver and gold are cupelled. This is the same idea as the lead collector in fire assay.
4. **Dezincing** — vacuum distillation removes leftover zinc
5. **Debismuthizing (Betterton-Kroll)** — add calcium and magnesium; they grab bismuth into a skimmable dross
6. **Final refining** → 99.97–99.99% lead

# Electrorefining (Betts process)
Lead anodes in lead fluosilicate electrolyte → pure cathode lead; bismuth and silver in slime.

# Recycling
Most lead today comes from **recycled car batteries** (secondary lead).
`},
{t:'Tin, Nickel & Cobalt', b:`
# Tin
Ore: **cassiterite (SnO₂)** — very heavy (SG about 7), concentrated by **gravity**.
1. Gravity concentration (and magnetic/flotation cleanup) → 60–75% Sn
2. Roast to remove sulfur and arsenic
3. **Smelt** with carbon at about 1200–1300 °C:
> SnO₂ + 2C → Sn + 2CO
Tin slag is often re-smelted (it holds a lot of tin)
4. **Refine** by **liquation** (heat just above tin's melting point, 232 °C; tin runs out leaving iron and copper behind), **boiling/poling**, or electrolysis.

# Nickel — sulfide ores
Ore: **pentlandite ((Fe,Ni)₉S₈)** with pyrrhotite and chalcopyrite.
1. Flotation → concentrate
2. Flash smelting → **matte**
3. Converting → **converter matte** (Ni₃S₂ + Cu₂S, low iron)
4. Refining by one of:
- **Mond (carbonyl) process** — carbon monoxide forms a volatile gas with nickel at about 50 °C, which decomposes back to very pure nickel at about 200–230 °C:
> Ni + 4CO ⇌ Ni(CO)₄
Nickel carbonyl is **extremely toxic**.
- **Electrorefining or electrowinning**
- **Sherritt ammonia pressure leach** then hydrogen reduction
PGMs, gold, silver, and cobalt are recovered from the residues.

# Nickel — laterite (oxide) ores
Weathered tropical soils (limonite, saprolite/garnierite), about 1–2% Ni.
- **HPAL (high-pressure acid leach)** — sulfuric acid in autoclaves at about 250 °C
- **RKEF (rotary kiln-electric furnace)** → **ferronickel** or nickel pig iron for stainless steel

# Cobalt
Mostly a **by-product** of copper (Central African Copperbelt) and nickel.
- Leached (often with copper), purified by precipitation and solvent extraction
- Recovered as cobalt hydroxide, then refined by **electrowinning** or as cobalt chemicals for batteries
`},
{t:'Titanium: The Kroll Process', b:`
Titanium can't be smelted with carbon (it forms titanium carbide and its oxide is very stable). It is made by reducing titanium chloride with magnesium.

# Ores
- **Rutile (TiO₂)** — 95% TiO₂
- **Ilmenite (FeTiO₃)** — upgraded to synthetic rutile or **titania slag** first (iron removed by smelting or leaching)

# Steps
1. **Chlorination** — TiO₂ + coke + chlorine in a fluidized bed at about 900–1000 °C:
> TiO₂ + 2Cl₂ + 2C → TiCl₄ + 2CO
2. **Purify TiCl₄ ("tickle")** by distillation — it's a liquid that boils at 136 °C
3. **Reduction** — TiCl₄ is fed into a sealed steel reactor of molten **magnesium** under **argon** at about 800–900 °C:
> TiCl₄ + 2Mg → Ti + 2MgCl₂
4. Product: porous **titanium sponge**
5. **Vacuum distillation** removes leftover Mg and MgCl₂
6. MgCl₂ is **electrolyzed** back to Mg and Cl₂ (recycled)
7. Sponge is crushed, pressed into electrodes, and melted by **vacuum arc remelting (VAR)** or electron-beam/plasma hearth melting into ingots

# Why so expensive
- Batch process, days per run
- Titanium reacts with oxygen, nitrogen, and hydrogen when hot → everything under vacuum or argon
- Oxygen contamination makes it brittle

Hook: **"Chlorinate, Clean, Kroll with magnesium, Melt in vacuum."**
`},
{t:'Magnesium & Lithium', b:`
# Magnesium
Sources: seawater and brines (MgCl₂), **dolomite** (CaCO₃·MgCO₃), **magnesite** (MgCO₃).

**Pidgeon process (silicothermic)** — most magnesium today:
1. Calcine dolomite → MgO·CaO
2. Mix with **ferrosilicon** and press into briquettes
3. Heat in sealed retorts under **vacuum** at about 1200 °C:
> 2(MgO·CaO) + Si → 2Mg (gas) + Ca₂SiO₄
4. Magnesium vapor condenses as crystals in the cool end
Works even though MgO is very stable because Mg leaves as a gas under vacuum, pulling the reaction forward (Le Chatelier).

**Electrolytic process**:
> MgCl₂ (molten) → Mg + Cl₂
Molten magnesium floats on the salt bath.

# Lithium
Sources: **brines** (salt flats) and **spodumene** (LiAlSi₂O₆) hard rock.

Brine route:
1. Pump brine into ponds; evaporate by sun for months
2. Remove magnesium and boron
3. Add soda ash:
> 2LiCl + Na₂CO₃ → Li₂CO₃ + 2NaCl
Product: **lithium carbonate**

Spodumene route:
1. Concentrate by DMS and flotation
2. **Roast at about 1050 °C** to change alpha to beta spodumene (more reactive)
3. **Acid roast** with sulfuric acid at about 250 °C, water leach → Li₂SO₄
4. Purify, precipitate Li₂CO₃ or make **lithium hydroxide**

Lithium **metal** is made by electrolysis of molten LiCl-KCl.

! Lithium and magnesium fires can't be put out with water — use **Class D** extinguishers or dry sand.
`},
{t:'Ferroalloys: Cr, Mn, Mo, W, V, Si', b:`
Most of these metals go into steel, so they are often made as **ferroalloys** (alloyed with iron) — cheaper and easier to dissolve in steel.

# Chromium
Ore: **chromite (FeCr₂O₄)**.
- **Ferrochrome**: smelt chromite with coke and quartz flux in a **submerged arc furnace**:
> FeCr₂O₄ + 4C → Fe + 2Cr + 4CO
- **Pure chromium**: aluminothermic reduction:
> Cr₂O₃ + 2Al → 2Cr + Al₂O₃
or electrolysis of chromium sulfate solution.

# Manganese
Ore: **pyrolusite (MnO₂)**.
- **Ferromanganese / silicomanganese**: smelted with coke in submerged arc or blast furnaces
- **Electrolytic manganese** from MnSO₄ solution
- Steel uses Mn to remove sulfur (forms MnS) and add strength

# Molybdenum
Ore: **molybdenite (MoS₂)** — often a by-product of porphyry copper mines.
1. Flotation → MoS₂ concentrate
2. Roast at about 600 °C:
> 2MoS₂ + 7O₂ → 2MoO₃ + 4SO₂
Product: **technical molybdic oxide**
3. **Ferromolybdenum**: aluminothermic/silicothermic reduction with iron oxide
4. **Pure Mo powder**: reduce purified MoO₃ with hydrogen:
> MoO₃ + 3H₂ → Mo + 3H₂O
Then press and sinter (powder metallurgy) — melting point 2623 °C is too high for normal casting.

# Tungsten
Ores: **wolframite ((Fe,Mn)WO₄)** and **scheelite (CaWO₄)**.
1. Gravity concentration (very heavy), flotation for scheelite
2. Digest with NaOH or soda ash → sodium tungstate
3. Purify → **ammonium paratungstate (APT)**
4. Calcine APT → WO₃
5. **Hydrogen reduction** at about 700–1000 °C:
> WO₃ + 3H₂ → W + 3H₂O
6. Powder metallurgy (melting point 3422 °C, highest of all metals)
Most tungsten goes into **tungsten carbide (WC)** cutting tools.

# Vanadium
Mostly from **vanadium-bearing titanomagnetite** (via steel slag) and as a by-product.
1. **Salt roast** with Na₂CO₃ → water-soluble sodium vanadate
2. Precipitate **ammonium metavanadate**, calcine → **V₂O₅**
3. **Ferrovanadium** by aluminothermic reduction:
> 3V₂O₅ + 10Al → 6V + 5Al₂O₃

# Silicon
- **Ferrosilicon / silicon metal** in a submerged arc furnace:
> SiO₂ + 2C → Si + 2CO
- Ultra-pure silicon for solar and chips: **Siemens process** (trichlorosilane distilled and decomposed on hot rods)
`},
{t:'Silver & Platinum-Group Metals', b:`
# Silver sources
- About **70%** is a by-product of lead, zinc, copper, and gold mining
- Primary silver ores: **acanthite/argentite (Ag₂S)**, native silver, ruby silvers (pyrargyrite, proustite), chlorargyrite (AgCl)

# Silver recovery routes
- **Cyanidation** like gold (Merrill-Crowe preferred because high silver overloads carbon)
- **Parkes process** — from lead bullion (zinc collects silver)
- **Copper anode slimes** — slimes are roasted/leached, smelted to **doré**
- **Patio process** (historic Mexico) — mercury and salt amalgamation in open patios
- Refined electrolytically (**Moebius or Balbach-Thum cell**) to 99.9%+

# Platinum-group metals (PGMs)
Six metals: **platinum, palladium, rhodium, ruthenium, iridium, osmium**.
Sources: Bushveld Complex (South Africa), Norilsk (Russia), Great Dyke (Zimbabwe), Stillwater (Montana), Sudbury (Canada). Usually with nickel-copper sulfides; grades only a few g/t.

# PGM extraction
1. Mine, crush, grind; **flotation** → concentrate
2. **Smelt** in electric furnace → nickel-copper-iron **matte** that collects PGMs (same idea as lead in fire assay)
3. **Convert** to remove iron
4. **Base metal refinery** — leach out nickel and copper; leaves a PGM concentrate (often 50%+ PGMs)
5. **Precious metal refinery** — dissolve in HCl + Cl₂, then separate each metal by **solvent extraction, ion exchange, and selective precipitation**
- Platinum is classically precipitated as **ammonium hexachloroplatinate**, (NH₄)₂PtCl₆, then heated to platinum sponge
6. Products: sponge or ingots, 99.95%+

# PGM assay
**Fire assay with lead collection** (palladium, platinum, gold together) or **nickel sulfide fire assay** (collects all six PGMs), finished by ICP.
`},
{t:'Mercury, Antimony, Bismuth & Others', b:`
# Mercury
Ore: **cinnabar (HgS)** — bright red.
Roast in air; mercury vapor is condensed:
> HgS + O₂ → Hg + SO₂
Also a by-product of gold and zinc processing. Toxic.

# Antimony
Ore: **stibnite (Sb₂S₃)**.
- **Iron precipitation**: Sb₂S₃ + 3Fe → 2Sb + 3FeS
- Or roast to Sb₂O₃ and reduce with carbon
Used in lead-acid battery grids, flame retardants.

# Bismuth
Mostly a **by-product of lead refining** (Betterton-Kroll dross) and of tungsten, copper.
Unusual: **expands on freezing** (like water); low melting point 271 °C; used in low-melt alloys, pharmaceuticals, lead-free solders and shot.

# Arsenic
By-product of roasting arsenopyrite (FeAsS) gold and copper ores, captured as **arsenic trioxide (As₂O₃)**. Highly toxic. Must be stabilized (as scorodite) for disposal.

# Cadmium
By-product of **zinc refining** (cementation residue). Used in Ni-Cd batteries, pigments, coatings. Toxic.

# Beryllium
Ore: **beryl (Be₃Al₂Si₆O₁₈)**, bertrandite. Processed to BeF₂ and reduced:
> BeF₂ + Mg → Be + MgF₂
Light and stiff. **Beryllium dust causes chronic beryllium disease** — strict controls.

# Rare earth elements
Ores: **bastnäsite**, **monazite**, ionic clays. Separated from each other by long **solvent extraction** circuits (their chemistry is nearly identical). Used in magnets (neodymium), catalysts, phosphors.

# Uranium (for completeness)
Acid or alkaline leach, often **in-situ recovery**; product is "yellowcake" (U₃O₈).
`},
{t:'Refining Methods (All Metals)', b:`
**Refining** removes impurities after extraction. Pick the method that exploits a difference between the metal and its impurities.

# Pyrometallurgical refining
- **Fire refining / oxidation** — blow air or oxygen; impurities that oxidize more easily go to slag (copper, lead softening, steelmaking)
- **Poling** — stir with green wood or inject natural gas to remove oxygen (copper, tin)
- **Liquation** — heat just above the metal's melting point; it melts and runs off from higher-melting impurities (tin, lead, bismuth)
- **Distillation** — boil the metal off (zinc, cadmium, mercury, magnesium)
- **Zone refining** — melt a narrow band and move it along a bar; impurities ride along with the molten zone (ultra-pure silicon, germanium)
- **Vacuum refining / degassing** — removes gases and volatile impurities (steel, titanium)
- **Cupellation** — oxidize lead away from silver and gold
- **Chlorination** — Miller process for gold

# Hydrometallurgical refining
- **Selective leaching**
- **Solvent extraction** — organic chemicals pick out one metal (copper, cobalt, nickel, rare earths, PGMs)
- **Ion exchange** — resin beads swap ions (uranium, gold from solution)
- **Precipitation / cementation**

# Electrolytic refining
- **Electrorefining** — impure anode dissolves; pure metal deposits on the cathode; noble impurities form **anode slime**, more reactive ones stay in solution (copper, lead, silver, gold, nickel)

# Chemical vapor refining
- **Mond process** — nickel carbonyl
- **Van Arkel–de Boer (iodide) process** — very pure titanium, zirconium, hafnium by forming a volatile iodide that decomposes on a hot wire
`},
{t:'Casting: Ingots, Bars & Anodes', b:`
After refining, metal is cast into a shape for sale or further processing.

# Products
- **Ingots** — blocks to remelt (aluminum, zinc, lead, tin)
- **Slabs, blooms, billets** — semi-finished steel shapes from continuous casting
- **Anodes** — copper anodes for electrorefining
- **Bars** — gold doré, Good Delivery gold and silver bars
- **Shot / grain** — small pellets (gold and silver grain for jewelers)
- **Cathode sheets** — copper, zinc, nickel

# Gold bar casting steps
1. Melt refined gold in a graphite crucible (induction furnace)
2. Preheat and coat the **graphite or cast-iron mold** (soot or mold wash so the bar releases)
3. Pour smoothly at about 1100–1200 °C
4. Cover or cool under controlled conditions so the surface is smooth (no shrinkage pipe)
5. **Quench**, clean in dilute acid, dry
6. **Stamp** refiner's mark, fineness, serial number, year
7. **Sample** (drill or melt sample) and **weigh**

# Casting defects (all metals)
- **Shrinkage cavities** — metal shrinks as it freezes; feeders/risers supply extra metal
- **Gas porosity** — dissolved gas comes out as bubbles; degas and dry molds
- **Inclusions** — slag or oxides trapped
- **Cold shuts** — two streams meet but don't fuse
- **Segregation** — chemistry varies through the casting
- **Hot tears** — cracks while still hot

! Molten metal and water = **steam explosion**. Every tool, mold, and addition must be completely dry and preheated.
`}
]});

GF.sec({id:'materials', title:'Smelting Materials', sub:'Ores, fluxes, slags, fuels, refractories', topics:[
{t:'Ore Minerals: Master List', b:`
Name — formula — metal — theoretical % metal

# Iron
- **Hematite** — Fe₂O₃ — 69.9% Fe — red streak
- **Magnetite** — Fe₃O₄ — 72.4% Fe — strongly magnetic, black streak
- **Goethite** — FeO(OH) — about 63% Fe
- **Siderite** — FeCO₃ — 48% Fe
- **Taconite** — low-grade magnetite/hematite chert rock (Minnesota)

# Copper
- **Chalcopyrite** — CuFeS₂ — 34.6% Cu — brassy yellow, most common copper ore
- **Chalcocite** — Cu₂S — 79.8% Cu
- **Bornite** — Cu₅FeS₄ — 63.3% Cu — "peacock ore"
- **Covellite** — CuS — 66.5% Cu
- **Malachite** — Cu₂CO₃(OH)₂ — 57.5% Cu — green
- **Azurite** — Cu₃(CO₃)₂(OH)₂ — 55.3% Cu — blue
- **Cuprite** — Cu₂O — 88.8% Cu
- **Chrysocolla** — hydrated copper silicate

# Gold & silver
- **Native gold** — Au; **electrum** — Au-Ag
- **Calaverite** — AuTe₂; **sylvanite** — (Au,Ag)Te₂
- **Acanthite/argentite** — Ag₂S — 87.1% Ag

# Lead & zinc

- **Cerussite** — PbCO₃

# Others
- **Cassiterite** — SnO₂ — 78.8% Sn

- **Bauxite** — Al(OH)₃ / AlO(OH) mix — aluminum

- **Wolframite** — (Fe,Mn)WO₄; **scheelite** — CaWO₄ — tungsten
- **Cinnabar** — HgS — mercury
- **Stibnite** — Sb₂S₃ — antimony
- **Cobaltite** — CoAsS — cobalt

- **Sperrylite** — PtAs₂ — platinum
- **Magnesite** — MgCO₃; **dolomite** — CaMg(CO₃)₂ — magnesium

# Common gangue and problem minerals
- **Quartz** — SiO₂
- **Calcite** — CaCO₃
- **Feldspar** — aluminosilicates
- **Pyrite** — FeS₂ ("fool's gold") — often carries invisible gold
- **Pyrrhotite** — Fe₁₋ₓS — magnetic; eats cyanide and oxygen
- **Arsenopyrite** — FeAsS — often carries gold; arsenic hazard

`},
{t:'Fluxes', b:`
A **flux** combines with gangue and impurities to make a slag that melts at a workable temperature and separates from the metal.

# The big rule: match acid with base
- **Acidic gangue** (silica-rich: quartz, sand) → add a **basic flux**
- **Basic gangue** (lime, magnesia, iron oxide) → add an **acidic flux**

# Basic fluxes
- **Limestone** — CaCO₃ → CaO when heated. Blast furnace, steelmaking.
- **Burnt lime / quicklime** — CaO. Steelmaking (removes P and S).
- **Dolomite** — CaMg(CO₃)₂. Also protects magnesia furnace linings.
- **Soda ash** — Na₂CO₃. Fire assay, gold smelting, desulfurizing iron.
- **Litharge** — PbO. Fire assay.
- **Magnesia** — MgO.

# Acidic fluxes
- **Silica / quartz sand** — SiO₂. Copper and nickel smelting (makes fayalite slag with iron), gold smelting.
- **Borax** — Na₂B₄O₇. Gold smelting, fire assay, brazing; lowers melting point and dissolves metal oxides.
- **Boric acid** — H₃BO₃.

# Neutral / thinning fluxes
- **Fluorspar (fluorite)** — CaF₂. Makes slag more fluid; steelmaking, assay.
- **Cryolite** — Na₃AlF₆. Not a slag flux, but the solvent bath for aluminum smelting.

# Oxidizing fluxes
- **Niter** — KNO₃ or NaNO₃. Oxidizes base metals and sulfides in gold smelting and assay.
- **Manganese dioxide** — MnO₂ (sometimes).

# Reducing additions
- **Flour, charcoal, coke, sugar** — carbon reducers.
- **Iron nails** — in assay of high-sulfide or high-arsenic ores, iron grabs sulfur (FeS) and helps form the button.

# Welding and soldering fluxes
- Borax, fluorides, chlorides (zinc chloride, ammonium chloride), rosin — clean oxide and protect the joint.

Hook: **"Acid rock needs a Base; Base rock needs an Acid."**
`},
{t:'Slag: What It Is and Why It Matters', b:`
**Slag** = the molten (then glassy or stony) waste layer of oxides, silicates, and other compounds that floats on top of metal or matte.

# Jobs of slag
1. **Collects impurities** — gangue (SiO₂, Al₂O₃), plus oxidized impurities (P, S, Mn, Fe)
2. **Protects** the metal from air (stops re-oxidation)
3. **Insulates** and holds heat
4. **Absorbs inclusions** from the metal
5. In steelmaking, controls chemistry (**refining slag**)

# Basicity
> Basicity ratio = %CaO ÷ %SiO₂  (or (CaO + MgO) ÷ SiO₂)
- **Above 1 = basic slag** → removes phosphorus and sulfur (steelmaking)
- **Below 1 = acid slag**
- Blast furnace slag is about 1.0–1.3

# Common slag types
- **Calcium silicate** — CaSiO₃ (blast furnace)
- **Fayalite** — Fe₂SiO₄ (copper, nickel smelting)
- **Borosilicate glass** — gold smelting, fire assay
- **Lead silicate** — PbSiO₃ (fire assay)

# A good slag is
- **Fluid** at operating temperature (low viscosity) so metal droplets fall through it
- **Lower density** than the metal (slag about 2.5–4 g/cm³; iron about 7, lead about 11, gold about 19)
- **Low in metal** (metal lost in slag = lost money)

# Metal losses in slag
- **Mechanical** — droplets or prills trapped in viscous slag
- **Chemical** — metal dissolved as oxide (e.g. copper oxide in an over-oxidized slag)
Slags from gold smelting are crushed and reprocessed for the gold prills they hold.

# Uses of slag
Blast furnace slag → cement, concrete aggregate, road base, mineral wool. Some slags (lead, arsenic) are hazardous waste.

# Matte and speiss
- **Matte** — molten sulfides (Cu₂S, FeS, Ni₃S₂) — heavier than slag, lighter than metal. Sought in copper/nickel smelting; unwanted in fire assay.
- **Speiss** — molten arsenides and antimonides (of Fe, Ni, Co, Cu) — heavy and brittle; forms between matte and metal.
`},
{t:'Fuels & Reducing Agents', b:`
# Coke
Coal baked at about 1000–1100 °C without air (in coke ovens). Volatiles are driven off, leaving strong, porous carbon.
- **Fuel** (burns to make heat)
- **Reducing agent** (makes CO)
- **Structural support** — the only solid at the bottom of a blast furnace, letting gas rise and liquids trickle down

# Charcoal
Wood heated without air. Very pure carbon (low sulfur). Historic ironmaking; still used in Brazil; used in assay.

# Carbon monoxide (CO)
The main gas-phase reducer in blast furnaces:
> FeO + CO → Fe + CO₂
**Boudouard reaction**: CO₂ + C ⇌ 2CO (high temperature favors CO)

# Hydrogen (H₂)
- Reduces tungsten, molybdenum, cobalt, nickel, iron (DRI)
- Water is the by-product instead of CO₂
> WO₃ + 3H₂ → W + 3H₂O

# Natural gas (CH₄)
- Heat source; reformed to CO + H₂ for DRI
- Used for "poling" copper

# Metal reducers (metallothermic)
- **Aluminum** (aluminothermic / thermite): Cr, V, Mn, ferroalloys, rail welding
> Fe₂O₃ + 2Al → 2Fe + Al₂O₃ (thermite, about 2500 °C)
- **Magnesium**: titanium, zirconium, beryllium, uranium
- **Silicon / ferrosilicon**: magnesium (Pidgeon), ferroalloys
- **Calcium**: rare earths, uranium, vanadium

# Electricity
The cleanest "reducing agent" — used where nothing chemical is strong enough (Al, Mg, Na, Li) or where purity matters (Cu, Zn, Au).

# Heat sources for furnaces
Fuel oil, propane, natural gas, coke, electricity (arc, induction, resistance).
`},
{t:'Refractories, Crucibles & Cupels', b:`
**Refractories** = heat-resistant materials that line furnaces, ladles, and crucibles.

# Classified by chemistry
- **Acid refractories** — **silica (SiO₂)** brick, fire clay. Resist acid slags; attacked by basic slags.
- **Basic refractories** — **magnesia (MgO)**, dolomite, magnesia-chrome, magnesia-carbon. Used in BOF, EAF, copper converters. Resist basic slags.
- **Neutral refractories** — **alumina (Al₂O₃)**, chromite, **carbon/graphite**, **silicon carbide (SiC)**, zirconia.

Rule: **match the refractory to the slag**. A basic slag eats an acid brick and vice versa.

# Properties wanted
- High melting point
- Resistance to slag attack
- **Thermal shock resistance** (survives sudden heating and cooling)
- Strength when hot
- Low heat conduction (for insulating layers)

# Crucibles
- **Fire clay crucibles** — fire assay (single use)
- **Clay-graphite** — gold and silver melting
- **Silicon carbide** — long life, fast heating; aluminum, copper, gold
- **Graphite** — induction melting of gold, silver, copper (not for iron, which absorbs carbon)
- **Alumina, zirconia, magnesia** — high-purity or reactive melts
- **Platinum** — lab work with fluxes
- **Porcelain** — parting cups, lab chemistry

# Crucible care
- Dry and preheat new crucibles (temper them) slowly to drive off moisture
- Never drop cold metal into a hot crucible or vice versa (cracking)
- Flux eats crucibles over time — inspect for thinning
- Don't use one crucible for different metals (contamination)

# Cupels
- **Bone ash** (calcium phosphate) — traditional, absorbs PbO
- **Magnesia (MgO) cupels** — modern, consistent
- Must be dried and preheated before use
`},
{t:'Furnace Gases & Atmospheres', b:`
# Gases used
- **Oxygen (O₂)** — steelmaking lance, oxygen-enriched smelting, cutting
- **Air** — blast furnace blast, converters, roasters, cupellation
- **Argon (Ar)** — inert shield for welding, titanium production, stainless AOD, stirring ladles
- **Nitrogen (N₂)** — inert purging, heat treatment atmospheres (dry), cooling
- **Hydrogen (H₂)** — reducing atmosphere, annealing copper/stainless, DRI
- **Chlorine (Cl₂)** — Miller gold refining, titanium chlorination, aluminum degassing (with argon)
- **Endothermic gas** — CO + H₂ + N₂ mix made from natural gas; carburizing and neutral hardening

# Atmosphere types
- **Oxidizing** — excess oxygen; burns off impurities but scales steel
- **Reducing** — excess CO or H₂; protects metal, reduces oxides
- **Neutral** — neither (argon, nitrogen)
- **Vacuum** — no gas; for reactive metals and high-quality heat treatment

# Off-gases to control
- **SO₂** — from roasting/smelting sulfides; → sulfuric acid plant
- **CO** — deadly, odorless; from blast furnaces and coke
- **CO₂**
- **Fume and dust** — lead, zinc, arsenic, cadmium oxides; captured in **baghouses** and **electrostatic precipitators (ESP)**
- **HCN** — cyanide plants if pH drops
- **NO₂** — nitric acid work
`}
]});

GF.sec({id:'chem', title:'Chemical Compounds', sub:'Formula, name, job, and memory hook', topics:[
{t:'How to Read a Chemical Formula', b:`
- **Element symbols** — one capital letter or a capital plus a lowercase letter (Fe, Au, Cl)
- **Subscript numbers** — how many atoms of the element before it. H₂SO₄ = 2 hydrogen, 1 sulfur, 4 oxygen.
- **Parentheses** — the group is multiplied by the number after it. Ca(OH)₂ = 1 Ca, 2 O, 2 H.
- **Charges** — written as superscripts on ions: Fe³⁺, SO₄²⁻, CN⁻
- **Dot (·)** — water or another compound loosely attached: CuSO₄·5H₂O (blue vitriol)
- **Roman numerals in names** — the charge on the metal. Iron(III) = Fe³⁺; copper(II) = Cu²⁺

# Naming patterns
- **-ide** — two elements: oxide (O), sulfide (S), chloride (Cl), fluoride (F), carbide (C), cyanide (CN)
- **-ate** — with oxygen: sulfate (SO₄), nitrate (NO₃), carbonate (CO₃), silicate (SiO₃/SiO₄), phosphate (PO₄)
- **-ite** — one less oxygen: sulfite (SO₃), nitrite (NO₂)
- **Hydroxide** — OH
- **Acids**: "hydro-___-ic acid" for no oxygen (hydrochloric HCl); "___-ic acid" for -ate ions (sulfuric H₂SO₄, nitric HNO₃)

# Common ions to memorize
- **OH⁻** hydroxide · **CN⁻** cyanide · **NO₃⁻** nitrate · **SO₄²⁻** sulfate · **CO₃²⁻** carbonate · **PO₄³⁻** phosphate · **Cl⁻** chloride · **S²⁻** sulfide · **O²⁻** oxide · **NH₄⁺** ammonium
`},
{t:'Bases: KOH, NaOH, Lime', b:`
# KOH — Potassium Hydroxide (caustic potash)
- **What it does**: strong base; neutralizes acids; dissolves aluminum and its oxide; used in electrolytes (alkaline batteries, some electrolysis), cleaning and degreasing metal, etching aluminum.
- **Reaction**: KOH + HCl → KCl + H₂O
- **Hazard**: severe skin and eye burns; heat released when dissolved.
- **Hook**: **"K-OH = Kitchen-strength Oven cleaner, but Harder."** K is potassium (from Latin *kalium*).

# NaOH — Sodium Hydroxide (caustic soda, lye)
- **What it does**: the workhorse base. **Bayer process** (dissolves aluminum from bauxite), **elution** of gold from carbon, keeps cyanide solutions alkaline, tungsten ore digestion, neutralizing acids, degreasing, pickling aluminum.
> Al(OH)₃ + NaOH → NaAl(OH)₄
> 2NaOH + H₂SO₄ → Na₂SO₄ + 2H₂O
- **Hazard**: severe burns; dissolving it in water gets very hot. Always add NaOH slowly to water.
- **Hook**: **"Na-OH, Na-OH, Burns you so."** Na = sodium (Latin *natrium*).

# CaO / Ca(OH)₂ — Quicklime / Hydrated (slaked) lime
- **What it does**: cheapest base. **Raises pH in cyanide leaching** (prevents HCN gas), flux in steelmaking (removes P and S), neutralizes acid mine water, pyrite depressant in flotation.
> CaCO₃ → CaO + CO₂ (burning limestone)
> CaO + H₂O → Ca(OH)₂ (slaking — gets hot)
- **Hook**: **"Lime keeps the Line"** — keeps cyanide on the safe side of pH 10.

# NH₃ / NH₄OH — Ammonia
- Weak base; nickel and copper ammonia leaching, thiosulfate gold leaching, precipitating APT (tungsten).
`},
{t:'Acids: HCl, H₂SO₄, HNO₃, Aqua Regia, HF', b:`
# HCl — Hydrochloric Acid (muriatic acid)
- **What it does**: **pickles steel** (removes rust and mill scale before galvanizing or plating), **acid-washes activated carbon** in gold plants, part of **aqua regia**, dissolves carbonates, used in Wohlwill gold refining, makes chloride solutions for PGM refining.
> Fe₂O₃ + 6HCl → 2FeCl₃ + 3H₂O
> CaCO₃ + 2HCl → CaCl₂ + H₂O + CO₂
- **Hazard**: corrosive fumes; attacks most metals (makes hydrogen gas — flammable).
- **Hook**: **"H-Cl = Hydrogen + CLeaner."** Chloride + hydrogen cleans rust off steel.

# H₂SO₄ — Sulfuric Acid
- **What it does**: the most-used industrial chemical. **Copper heap leaching and SX-EW**, zinc leaching, uranium leaching, steel pickling, **battery electrolyte**, **anodizing** aluminum, made from smelter SO₂.
> CuO + H₂SO₄ → CuSO₄ + H₂O
> ZnO + H₂SO₄ → ZnSO₄ + H₂O
- **Hazard**: dehydrating and very corrosive; huge heat when mixed with water. **Always add acid to water.**
- **Hook**: **"SO₄ = Sulfate FOUR oxygens — the acid that makes sulfates."**

# HNO₃ — Nitric Acid
- **What it does**: **parting** (dissolves silver from gold in fire assay and refining), part of **aqua regia**, dissolves copper and most base metals, passivates stainless steel, etching.
> 3Ag + 4HNO₃ → 3AgNO₃ + NO + 2H₂O
> 3Cu + 8HNO₃ → 3Cu(NO₃)₂ + 2NO + 4H₂O
- Gold does **not** dissolve in nitric alone — the old "acid test" for gold.
- **Hazard**: strong oxidizer; makes toxic brown NO₂ gas; reacts violently with organics.
- **Hook**: **"Nitric Nabs silver, Not gold."**

# Aqua Regia — 3 HCl : 1 HNO₃ ("royal water")
- **What it does**: dissolves **gold and platinum**. Nitric oxidizes the gold; chloride grabs the ions so they can't come back out.
> Au + HNO₃ + 4HCl → HAuCl₄ + NO + 2H₂O
- Used for gold refining, dissolving assay beads for AAS, digesting samples.
- Doesn't dissolve silver (AgCl forms a protective coat), rhodium, iridium, or (much) ruthenium and osmium.
- **Hazard**: unstable — make fresh; never store in a sealed bottle (gas pressure bursts it).
- **Hook**: **"3 to 1, the King is done."** (Gold is the king of metals.)

# HF — Hydrofluoric Acid
- Dissolves silica; used in four-acid digests, glass etching, pickling stainless and titanium.
- **Extremely dangerous** — penetrates skin and attacks bone and heart (binds calcium). Calcium gluconate gel must be on hand. Special training required.

# H₃PO₄ — Phosphoric Acid
- Rust converter (forms iron phosphate), phosphate coatings under paint.
`},
{t:'Oxides: Fe₂O₃, Al₂O₃, CuO, PbO, SiO₂ & More', b:`
# Fe₂O₃ — Iron(III) Oxide (hematite, rust)
- **What it is**: main iron ore; red rust; red pigment; polishing compound ("jeweler's rouge"); thermite ingredient.
- **Reaction**: Fe₂O₃ + 3CO → 2Fe + 3CO₂ (blast furnace)
- **Hook**: **"Two irons, three oxygens — Red rust."** Iron is +3 (III).

# Fe₃O₄ — Iron(II,III) Oxide (magnetite, mill scale)
- Magnetic iron ore; black scale on hot-rolled steel.

# Al₂O₃ — Aluminum Oxide (alumina, corundum)
- **What it is**: product of the Bayer process and feed for aluminum smelting; the **protective film** on aluminum; very hard (Mohs 9) — **abrasive** (sandpaper, grinding wheels); **refractory**; ruby and sapphire are corundum.
- Melts at 2072 °C — that's why it's dissolved in cryolite instead of melted.
- **Hook**: **"Al-two O-three: Abrasive, Armor, Aluminum's source."**

# CuO — Copper(II) Oxide (tenorite)
- **What it is**: black oxide on heated copper; copper ore mineral; pigment; reduced by carbon or hydrogen to copper.
> CuO + H₂ → Cu + H₂O
- **Hook**: **"Cu-O = Copper gone black."** Copper is +2 here (II).
- **Cu₂O — copper(I) oxide (cuprite)**: red; ore mineral.

# PbO — Lead(II) Oxide (litharge)
- **What it is**: main ingredient of fire assay flux — supplies the lead collector; forms during cupellation and soaks into the cupel; lead glass and battery paste.
> 2PbO + C → 2Pb + CO₂
- **Hook**: **"Litharge Lets lead Lasso the gold."**

# SiO₂ — Silica (quartz, sand)
- **What it is**: most common gangue mineral; **acid flux** (copper smelting, gold smelting, assay); refractory (silica brick); molding sand for casting; glass.
> 2FeO + SiO₂ → Fe₂SiO₄ (fayalite slag)
> CaO + SiO₂ → CaSiO₃ (blast furnace slag)
- **Hook**: **"Silica is Sand — it Slags the iron away."**
- **Hazard**: fine silica dust causes **silicosis**.

# ZnO — Zinc Oxide
- Roasted zinc concentrate (calcine); white pigment; rubber; sunscreen. Fume from welding galvanized steel → "metal fume fever."

# MgO — Magnesia
- Basic refractory (furnace linings), cupels, flux.

# CaO — Lime
- See Bases.

# TiO₂ — Titanium Dioxide (rutile)
- Titanium ore; brilliant white pigment.

# Cr₂O₃ — Chromium(III) Oxide
- The thin **passive film** that makes stainless steel stainless; green pigment.

# V₂O₅ — Vanadium Pentoxide
- Catalyst in sulfuric acid plants; feed for ferrovanadium.
`},
{t:'Salts: CuSO₄, ZnCl₂, NaCN, AgNO₃ & More', b:`
# CuSO₄ — Copper(II) Sulfate (blue vitriol, as CuSO₄·5H₂O)
- **What it does**: **electrolyte** for copper electrorefining and plating; **flotation activator** (makes sphalerite and pyrite float); copper cementation demonstration; catalyst in cyanide destruction; fungicide.
> Fe + CuSO₄ → FeSO₄ + Cu (iron nail turns copper-colored)
- **Hook**: **"Copper Sulfate is Sky-blue and Swims in the plating tank."**

# ZnCl₂ — Zinc Chloride
- **What it does**: **soldering and galvanizing flux** — dissolves oxides so solder or zinc can wet the steel; part of "zinc ammonium chloride" galvanizing flux; battery electrolyte; wood preservative.
- **Hook**: **"Zinc Chloride Cleans the joint."**

# NaCN — Sodium Cyanide
- **What it does**: **dissolves gold and silver** in leaching; flotation depressant; electroplating baths (gold, silver, copper, zinc, cadmium).
> 4Au + 8NaCN + O₂ + 2H₂O → 4NaAu(CN)₂ + 4NaOH
- Shipped as briquettes or solution; dissolved into **caustic** (high pH) water.
- **Hazard**: **extremely toxic** by mouth, skin, or as HCN gas. Never contact acid. Antidote kits (hydroxocobalamin) and trained responders required on site.
- **Hook**: **"CN = Can't Neglect safety; Captures Nuggets."**

# KCN — Potassium Cyanide
- Same chemistry; used in plating and labs.

# AgNO₃ — Silver Nitrate
- Product of nitric parting; **silver inquart** solution for fire assay; silver plating; test for chloride (white AgCl precipitate).

# AgCl — Silver Chloride
- White solid from Miller refining and aqua regia; turns purple-gray in light; reduced back to silver.

# HAuCl₄ — Chloroauric Acid (gold chloride)
- Gold dissolved in aqua regia; Wohlwill electrolyte; reduced to gold powder by SO₂ or SMB.

# Na₂S₂O₅ — Sodium Metabisulfite (SMB)
- **Precipitates gold** from chloride solutions; cyanide destruction (SO₂/air); flotation depressant.

# FeSO₄ — Ferrous Sulfate (copperas)
- Precipitates gold from chloride solutions; water treatment.

# Pb(NO₃)₂ — Lead Nitrate
- Added in **cyanide leaching** to reduce sulfide passivation of gold; added with zinc in **Merrill-Crowe**.

# Na₂CO₃ — Sodium Carbonate (soda ash)
- Basic flux (assay, smelting); pH control; lithium carbonate precipitation; desulfurizing iron.

# Na₂B₄O₇ — Borax
- Glassy flux for gold smelting, assay, brazing and welding.

# KNO₃ / NaNO₃ — Niter / Saltpeter
- Oxidizing flux in gold smelting and assay.

# Na₃AlF₆ — Cryolite
- Molten solvent bath for aluminum electrolysis.

# NH₄Cl — Ammonium Chloride (sal ammoniac)
- Soldering and galvanizing flux; cleans tinning irons.

# MgCl₂ — Magnesium Chloride
- Electrolysis feed for magnesium; by-product of the Kroll process.

# TiCl₄ — Titanium Tetrachloride ("tickle")
- Intermediate in the Kroll process; fumes in moist air (makes HCl).

# Na₃PO₄ — Trisodium phosphate
- Alkaline degreaser before plating and painting.
`},
{t:'Fluxes & Minerals: CaCO₃, CaF₂ & More', b:`
# CaCO₃ — Calcium Carbonate (limestone, calcite)
- **What it does**: **flux** in blast furnaces (burns to CaO, which reacts with silica); neutralizes acid (POX slurry, acid mine drainage); raw material for lime and cement.
> CaCO₃ → CaO + CO₂
> CaO + SiO₂ → CaSiO₃
- Fizzes in dilute HCl — a quick field test.
- **Hook**: **"Limestone Licks up silica."**

# CaF₂ — Calcium Fluoride (fluorspar)
- **What it does**: thins slag (more fluid) in steelmaking, assay, and smelting; source of HF.
- **Hook**: **"Fluorspar makes slag Flow."** ("Fluor" comes from Latin "to flow.")

# CaMg(CO₃)₂ — Dolomite
- Basic flux and refractory; magnesium ore.

# FeS₂ — Pyrite
- "Fool's gold"; often carries **invisible gold**; strong **reducing** agent in fire assay; burns to SO₂ in roasting; acid rock drainage source.

# C — Coke / Charcoal / Graphite
- Fuel, reducer, crucibles, electrodes, cathode lining (aluminum cells).

# Activated carbon
- Coconut-shell carbon with huge internal surface; **adsorbs Au(CN)₂⁻** in CIP/CIL/CIC.
`},
{t:'Quick Formula Flashcards', b:`
- **NaOH** — sodium hydroxide — strong base, Bayer, elution
- **KOH** — potassium hydroxide — strong base
- **CaO** — lime (quicklime) — flux, pH control
- **Ca(OH)₂** — slaked lime — pH control
- **HCl** — hydrochloric acid — pickling, carbon acid wash
